set.item:
  itemName: <#C21807>Clown Mask
  type: PAPER
  itemModel: mineinabyss:clown_mask
  lore:
  - ':troll:'
  - <gold>Found during April Fools 2025.
  - <gold>You thought this was a good item didn't you.
  - <gold>RIGHT CLICK TO OBTAIN WARDROBE COSMETIC
  - <gold>THIS WILL CONSUME YOUR ITEM
  enchantable: 0
disableItemInteractions: {}
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - haspermission{p=hmccosmetics.hat.clown_mask} false
    onFail:
    - sendActionBar:
        text: <#454A46>You already have this cosmetic
  - cooldown:
      id: cosmetic
      length: 10s
      display: <#454A46>You already have this cosmetic
  - mythicSkills:
    - hmc_clown_mask_cosmetic
  - consumeItem:
      type: mineinabyss:clown_mask_new
    when:
    - chance: 1
resourcepack:
  model: mineinabyss:item/event/clown_mask
