set.item:
  type: minecraft:netherite_pickaxe
  itemModel: mineinabyss:atlas_dignitas
  itemName: <#617B94><b>Atlas Dignitas
  lore:
  - ':layer_4: Grade I Relic'
  - <#C6CC8A>Contains <white>Everlasting Gunpowder<#C6CC8A>,
  - <#C6CC8A>which causes ongoing explosions
  - <#C6CC8A>on whatever it is struck on.
  - <#948E61><i>Used to create powerful explosions.
  enchantments:
    - enchant: minecraft:silk_touch
      level: 1
    - enchant: minecraft:efficiency
      level: 7
  enchantable: 0
  unbreakable: {}
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - FoodLevel{a=<4} true
    onFail:
    - sendActionBar:
        text: <red>Out of Food
  - cooldown:
      id: AtlasDignitas
      length: 60s
      display: <#617B94>Atlas Dignitas
  - mythicSkills:
    - atlas_dignitas

resourcepack:
  model: mineinabyss:item/relics/atlas_dignitas