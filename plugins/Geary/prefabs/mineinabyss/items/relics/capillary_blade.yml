set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:capillary_blade
  itemName: <#15ABC2><b>Capillary Growth
  lore:
  - ':layer_3: Grade I Relic'
  - <#249C9C>A weapon that can tear into the fabric of the force field.
  - <#195959><i>It is known to create crescent shaped slashes damaging
  - <#195959><i>all organic matter that it comes into contact with.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaura{aura=capillary_extend_aura} false 
    onFail:
    - sendActionBar:
        text: <red>Weapon Extended
  - mythicSkills:
    - heal{amount=1} ~onKill
  itemRightClick:
  - become: parent
  - cooldown:
      id: capillary_extend
      length: 8s #change to 35s once testing is done
      display: <#15ABC2>Capillary Blade
  - mythicSkills:
    - capillary_extend
resourcepack:
  model: mineinabyss:item/relics/capillary_blade