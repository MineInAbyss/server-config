set.item:
  itemName: <#88D481>Ray-healing Plate
  type: PAPER
  itemModel: mineinabyss:ray-healing_plate
  lore:
  - ':layer_1::layer_2: Special Grade Relic'
  - <gold>An organic object that symbiotically attaches like a parasite.
  - <#D2D489><i>When the hosts adrenaline level spikes the
  - <#D2D489><i>relic consumes energy reserves to heal its habitat.
disableItemInteractions: {}
passive:
- match:
  - inInventory
  every: 1s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:ray-healing_plate
  - particle:
      particle: CLOUD
      offset:
      - 0
      - 1
      - 0
      count: 10
      speed: 0
    with:
      location: '{{ entity.getLocation }}'
  - mythicSkills:
    - ray-healing_heal

resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/ray-healing_plate