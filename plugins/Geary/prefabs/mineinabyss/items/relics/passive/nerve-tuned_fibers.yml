set.item:
  itemName: <#808000>Nerve-tuned Fibers
  type: minecraft:paper
  itemModel: mineinabyss:nerve-tuned_fibers
  lore:
  - ':layer_4: Grade III Relic'
  - <#A3A300>Bearers of this organic armor describe wearing it as disgusting,
  - <#A3A300>though some insist it makes them feel less alone in the vast Abyss.
  - <#D1D100><i>Passive slot ability. Twitches and grants haste.
passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:nerve-tuned_fibers 
  - applyPotionEffects:
    - type: minecraft:haste
      duration: 8s
      hasParticles: false
  - mythicSkills:
    - nerve-tunedtwitch

resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/nerve-tuned_fibers
