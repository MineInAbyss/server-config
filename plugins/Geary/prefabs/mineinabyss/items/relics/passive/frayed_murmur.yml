set.item:
  itemName: <#88D481>Frayed Murmur
  type: PAPER
  itemModel: mineinabyss:frayed_murmur
  lore:
  - ':layer_1::layer_2: Special Grade Relic'
  - <gold>An organic object that symbiotically attaches like a parasite.
  - <#D2D489><i>When the hosts adrenaline level spikes the
  - <#D2D489><i>relic consumes energy reserves to heal its habitat.
passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:frayed_murmur
  - applyPotionEffects:
    - type: minecraft:invisibility
      duration: 8s
      hasParticles: false
  - mythicSkills:
    - frayed_murmur

resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/frayed_murmur