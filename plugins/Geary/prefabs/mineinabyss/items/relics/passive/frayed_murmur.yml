set.item:
  itemName: <#f7e7ce>Frayed Murmur
  type: minecraft:paper
  itemModel: mineinabyss:frayed_murmur
  lore:
  - ':layer_3: Grade III relic'
  - <#d7c9b3>Derived from technology recovered from Interference Units, this
  - <#d7c9b3>mask bends light around its wearer, but inexplicably not itself.
  - <#ebdcc6><i>Passive slot ability. Turns the user invisible.
passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:frayed_murmur
  - applyPotionEffects:
    - type: minecraft:invisibility
      duration: 8s
      hasParticles: false
  - mythicSkills:
    - frayed_murmur

resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/frayed_murmur
