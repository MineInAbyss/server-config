set.item:
  itemName: <#88D481>Sudden Pinch
  type: PAPER
  itemModel: mineinabyss:animal_totem
  lore:
  - ':layer_1::layer_2: Grade IV Relic'
  - <gold>Stories have been passed around about a Cave Raider who used this 
  - <gold>Relic to keep himself constantly awake through his expeditions.
  - <#D2D489><i>Passive ability. Grants a short speed
  - <#D2D489><i>buff when equipped in a passive slot.
passive:
- match:
  - inInventory
  every: 30s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:animal_totem
  - applyPotionEffects:
    - type: minecraft:speed
      duration: 3s
      amplifier: 1
      hasParticles: false
  - mythicSkills:
    - sudden_pinch_1
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/sudden_pinch
