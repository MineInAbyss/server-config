set.item:
  itemName: <#808000>Mermaid Burp
  type: minecraft:paper
  itemModel: mineinabyss:mermaid_burp
  lore:
  - ':layer_3: Grade III Relic'
  - <#A3A300>The air produced by this Relic has a notably fishy smell. 
  - <#D1D100><i>Passive slot ability. Grants water breathing.
passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:mermaid_burp
  - applyPotionEffects:
    - type: minecraft:water_breathing
      duration: 6s
      hasParticles: false
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/mermaid_burp
