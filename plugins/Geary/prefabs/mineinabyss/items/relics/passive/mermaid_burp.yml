set.item:
  itemName: <#88D481>Mermaid Burp
  type: PAPER
  itemModel: mineinabyss:mermaid_burp
  lore:
  - ':layer_3: Grade III Relic'
  - <gold>It is an Artifact that produces gas. 
  - <#D2D489><i>Passive slot ability. Grants water breathing.
passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:mermaid_burp
  - applyPotionEffects:
    - type: minecraft:water_breathing
      duration: 6s
      hasParticles: false
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/sudden_pinch