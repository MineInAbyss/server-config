set.item:
  itemName: <#f7e7ce>Ray-healing Plate
  type: minecraft:paper
  itemModel: mineinabyss:ray-healing_plate
  lore:
  - ':layer_1: Grade III Relic'
  - <#d7c9b3>Holders of this Relic report that it feels warm
  - <#d7c9b3>and comfortable to the touch, even in cold climates.
  - <#ebdcc6><i>Passive slot ability. Slowly heals the user
  - <#ebdcc6><i>when above a specific light level.
passive:
- match:
  - inInventory
  every: 1s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:ray-healing_plate
  - mythicSkills:
    - ray-healing_heal

resourcepack:
  textures:
    layers:
    - mineinabyss:relics/ray-healing_plate
