set.item:
  itemName: <#976d5c>Propulsion Charm
  type: minecraft:paper
  itemModel: mineinabyss:relic_boots
  lore:
  - ':layer_3: Grade II Relic'
  - <gold>Boots said to imitate the innate
  - <gold>abilities of a famous delver.
  - <#D2D489><i>On use they grant the wearer a short boost
  - <#D2D489><i>in strength allowing delvers to ascend faster.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=boot;s=3} true
    onFail:
    - sendActionBar:
        text: <red>Out of Charge
  - mythicSkills:
    - boot_fly
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=boot;s=3} true
    onFail:
    - sendActionBar:
        text: <red>Out of Charge
  - mythicSkills:
    - boot_fly_forward
passive:
- match:
  - inHand
  every: 2s
  run:
  - become: parent
  - ensure:
      player:
        sneaking: true
  - mythicSkills:
    - bootcharge
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/treble_winds
