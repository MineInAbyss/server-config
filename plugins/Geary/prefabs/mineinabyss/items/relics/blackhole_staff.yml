set.item:
  type: minecraft:paper
  itemName: <#302D2D><b>Subtle Pull
  itemModel: mineinabyss:blackhole_staff
  lore:
  - ':layer_5: Grade I Relic'
  - <#570F01>A powerful artifact of Orthian tales rumored
  - <#570F01>to have led to civilisations collapse.
  - <#3B1F1A><i>On use it is able to influence the
  - <#3B1F1A><i>gravitational pull within the force field.
disableItemInteractions: {}
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>5} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: blackhole
      length: 100s
      display: <#302D2D><b>Subtle Pull
  - mythicSkills:
    - blackhole
resourcepack:
  model: mineinabyss:item/relics/subtle_pull
