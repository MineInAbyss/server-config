set.item:
  itemName: <#88D481>Fright Instinct
  type: PAPER
  itemModel: mineinabyss:animal_totem
  lore:
  - ':layer_1: Grade IV Relic'
  - <gold>A mysterious totem calling upon the desire
  - <gold>to survive to escape from predators.
  - <#D2D489><i>It grants the wearer adrenaline when used.
disableItemInteractions: {}
observe:
  itemSneak:
    - become: parent
    - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:animal_totem
        player:
          sneaking: true
    - cooldown:
        id: animal_totem
        length: 60s
        display: <#617B94>Animal Totem
    - applyPotionEffects:
        - type: minecraft:speed
          duration: 2s
          amplifier: 3
          hasParticles: false
passive:
- match:
  - inInventory
  every: 30s
  run:
  - become: parent
  - particle:
      particle: CLOUD
      offset:
      - 0
      - 1
      - 0
      count: 10
      speed: 0
    with:
      location: '{{ entity.getLocation }}'
  - applyPotionEffects:
    - type: minecraft:speed
      duration: 3s
      amplifier: 1
      hasParticles: false
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/sudden_pinch
