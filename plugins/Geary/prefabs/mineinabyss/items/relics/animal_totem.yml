set.item:
  itemName: <#88D481>Fright Instinct
  type: PAPER
  itemModel: mineinabyss:animal_totem
  lore:
  - ':layer_1: Grade IV Relic'
  - <gold>A mysterious totem calling upon the desire
  - <gold>to survive to escape from predators.
  - <#D2D489><i>It grants the wearer adrenaline when used.
disableItemInteractions: {}
passive:
- match:
  - inInventory
  every: 30s
  run:
  - become: parent
  - ensure:
        inSlot:
          slots: [ 9, 10 ]
          item: mineinabyss:animal_totem
  - particle:
      particle: CLOUD
      offset:
      - 0
      - 1
      - 0
      count: 10
      speed: 0
    with:
      location: '{{ entity.getLocation }}'
  - applyPotionEffects:
    - type: minecraft:speed
      duration: 3s
      amplifier: 1
      hasParticles: false
  - mythicSkills:
    - sudden_pinch_1
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/sudden_pinch
