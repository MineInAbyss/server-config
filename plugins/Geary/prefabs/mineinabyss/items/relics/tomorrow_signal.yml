set.item:
  type: minecraft:clock
  itemName: <dark_gray>Tomorrow Signal
  itemModel: mineinabyss:relics/tommorow_signal
resourcepack:
  model: mineinabyss:relics/tommorow_signal
observe:
  itemLeftClick:
  - become: parent
  - cooldown:
      id: lightning_strike
      length: 2s
      display: <dark_gray>Tomorrow Signal
  - eval: 'entity.getTargetBlock { maxDistance: 15 }'
    register: targetBlock
  - smite: {}
    with:
      location: '{{ targetBlock }}'
  - particle:
      particle: CLOUD
      count: 10
      speed: 0.2
    with:
      location: '{{ targetBlock }}'
