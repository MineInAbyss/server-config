set.item:
  itemName: <#88D481>Nerve-tuned Fibers
  type: PAPER
  itemModel: mineinabyss:nerve-tuned_fibers
  lore:
  - ':layer_1::layer_2: Special Grade Relic'
  - <gold>An organic object that symbiotically attaches like a parasite.
  - <#D2D489><i>When the hosts adrenaline level spikes the
  - <#D2D489><i>relic consumes energy reserves to heal its habitat.

passive:
- match:
  - inInventory
  every: 4s
  run:
  - become: parent
  - particle:
      particle: CLOUD
      offset:
      - 0
      - 1
      - 0
      count: 10
      speed: 0
    with:
      location: '{{ entity.getLocation }}'
    
  - applyPotionEffects:
    - type: minecraft:haste
      duration: 8s
      hasParticles: false
  - mythicSkills:
    - nerve-tunedtwitch


resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/nerve-tuned_fibers