set.item:
  type: minecraft:paper
  itemName: <#CCDADB>Soul-aiming Light
  itemModel: mineinabyss:soul-aiming_light
  lore:
  - ':layer_5: Grade I Relic'
  - <#A0ACAD>A long frail pole carved from one of the
  - <#A0ACAD>crystallized sections surrounding the Sea of Corpses.
  - <#7B898A><i>It has the ability to flash-freeze air
  - <#7B898A><i>which freezes all organic matter it touches.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: aiming_light
      length: 8s #change to 30-40s after testing
      display: <#CCDADB>Aiming Light
  - applyPotionEffects:
    - type: minecraft:glowing
      duration: 10s
      amplifier: 1
      hasParticles: false
    - type: minecraft:blindness
      duration: 1s
      amplifier: 1
      hasParticles: false
  - geary:shulker_bullet:
      amount: 3
      damage: 15
      radius: 20
      homing: true
      speed: 2
      duration: 40
      effects:
        - type: minecraft:glowing
          duration: 5.0t
        - type: minecraft:blindness
          duration: 3.0t
          amplifier: 1
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/soul-aiming_light
  parentModel: item/handheld
