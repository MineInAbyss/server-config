set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:reverberating_edge
  itemName: <#15ABC2><b>Reverberating Edge
  lore:
  - ':layer_4: Grade I Relic'
  - <#249C9C>The innate abilities carried by this dagger might make its use
  - <#249C9C>look effortless, but it’s actually taxing on the wielder.
  - <#195959><i>Active ability. Each hit creates charges and deals additional
  - <#195959><i>damage at 7 charges. Takes 10 charges to stun surroundings on right click.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - mythicSkills:
    - reverberating_edge_hit
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=reverberatingedgestack;s=10} true
    onFail:
    - sendActionBar:
        text: <red>Sword is not charged
  - cooldown:
      id: reverberating_edge
      length: 50s
      display: <#617B94>Reverberating Edge
  - mythicSkills:
    - reverberating_edge_ability
resourcepack:
  model: mineinabyss:item/relics/reverberating_edge