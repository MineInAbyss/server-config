set.item:
  itemName: <#705160><b>Shifting Pike
  type: minecraft:netherite_sword
  itemModel: mineinabyss:bounding_lance
  lore:
  - ':layer_1: :layer_2: Grade I Relic'
  - <#AB8E8A>This Relic commonly finds its use supporting
  - <#AB8E8A>wielders of more offensively-focused relics,
  - <#AB8E8A>but is perfectly capable on its own as well.
  - <#695654><i>When used it simulates blessings
  - <#695654><i>in its surroundings.
  unbreakable: {}
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=shiningstop;s=1} false
    onFail:
    - sendActionBar:
        text: <red>In Cooldown  
  - cooldown:
      id: changestance
      length: 1s
      display: <#705160><b>Change Form
  - mythicSkills:
    - shiftingpikecharge
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=boundinglance} false
    onFail:
    - sendActionBar:
        text: <red>Not Primed
  - cooldown:
      id: shifting_pike
      length: 40s
      display: <#705160><b>Shifting Pike
  - mythicSkills:
    - shifting_pike

resourcepack:
  model: mineinabyss:item/relics/shining_pike
