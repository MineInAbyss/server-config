set.item:
  itemName: <#E7EBE9>Undying Wisp
  type: PAPER
  itemModel: mineinabyss:bone_staff
  lore:
  - ':layer_5: Grade III Relic'
  - <gold>The sound produced by this seemingly-primitive rattle is
  - <gold>enough to send chills down the spine of any who hear it.  
  - <#D2D489><i>Active ability. Shoots projectile on right click.
  - <#D2D489><i>Projectile stuns the target it hits.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>1} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: undying_wisp
      length: 20s
      display: <dark_aqua>Undying Wisp
  - mythicSkills:
    - undying_wisp
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/undying_wisp
  parentModel: item/handheld
