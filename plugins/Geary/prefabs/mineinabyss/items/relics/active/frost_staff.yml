set.item:
  type: minecraft:paper
  itemName: <#CCDADB><b>Shiver Mist
  itemModel: mineinabyss:frost_staff
  lore:
  - ':layer_5: Grade I Relic'
  - <#A0ACAD>The chemicals produced by this Relic maintain a cold enough
  - <#A0ACAD>temperature to freeze one solid, even in the hottest of climates.
  - <#7B898A><i>Active ability. Shoots a bunch of inaccurate projectiles
  - <#7B898A><i>on right click. Projectiles freeze and slow the target on hit.
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: shiver_mist_area
      length: 35s
      display: <#CCDADB>Shiver Mist
  - mythicSkills:
    - shiver_mist_hit
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
      - hasaurastacks{n=shivermistcharge} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: shiver_mist
      length: 40s
      display: <#CCDADB>Shiver Mist
  - mythicSkills:
    - shiver_mist
passive:
- match:
  - inHand
  every: 0.1s
  run:
  - become: parent
  - mythicSkills:
    - shiver_mist_charger
resourcepack:
  model: mineinabyss:item/relics/shiver_mist
