set.item:
  type: minecraft:netherite_pickaxe
  itemModel: mineinabyss:atlas_dignitas
  itemName: <#617B94><b>Atlas Dignitas
  lore:
  - ':layer_3: Grade I Relic'
  - <#C6CC8A>This Relic has found success in the mining, construction
  - <#C6CC8A>and physical therapy industries, strangely enough.
  - <#948E61><i>Active ability. On right click starts to consume
  - <#948E61><i> food in exchange of a mining speed buff.
  enchantments:
    - enchant: minecraft:silk_touch
      level: 1
    - enchant: minecraft:efficiency
      level: 6
  enchantable: 0
  unbreakable: {}
disableItemInteractions: {}
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - FoodLevel{a=>4} true
    onFail:
    - sendActionBar:
        text: <red>Out of Food
  - cooldown:
      id: AtlasDignitas
      length: 80s
      display: <#617B94>Atlas Dignitas
  - mythicSkills:
    - atlas_trigger
itemLeftClick:
  - become: parent
  - mythicSkills:
    - atlas_dignitas

resourcepack:
  model: mineinabyss:item/relics/atlas_dignitas