set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:yukonokage
  itemName: <#15ABC2><b>Yukonokage
  lore:
  - ':layer_3: Grade I Relic'
  - <#249C9C>A weapon that can tear into the fabric of the force field.
  - <#195959><i>It is known to create crescent shaped slashes damaging
  - <#195959><i>all organic matter that it comes into contact with.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - mythicSkills:
    - yukonokage_hit
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=yukonokagestack;s=20to220} true
    onFail:
    - sendActionBar:
        text: <red>You have no souls
  - cooldown:
      id: yukonokage
      length: 5s
      display: <#617B94>Yukonokage
  - mythicSkills:
    - yukonokage_ability
passive:
- match:
  - inHand
  every: 1s
  run:
  - become: parent 
  - mythicSkills:
    - yukonokage_soul_display
resourcepack:
  model: mineinabyss:item/relics/yukonokage