set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:capillary_blade
  itemName: <#15ABC2><b>Capillary Growth
  lore:
  - ':layer_1: Grade I Relic'
  - <#249C9C>Rather unceremoniously cobbled together from the remains of an
  - <#249C9C>Interference Unit, this sword carries on its user’s mysterious directives.
  - <#195959><i>Active ability. Heals user on kill. Charges ability on right click.
  - <#195959><i> Takes n charges to xxx on left click.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - mythicSkills:
    - capillary_hit
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=capillarygrowthstack;s=10} true
    onFail:
    - sendActionBar:
        text: <red>In Cooldown  
  - cooldown:
      id: capillary_growth
      length: 15s
      display: <#617B94>Capillary Growth
  - mythicSkills:
    - capillary_growth_effect
resourcepack:
  model: mineinabyss:item/relics/capillary_blade