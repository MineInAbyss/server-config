set.item:
  type: minecraft:paper
  itemName: <#6E260E>Ball Lightning
  itemModel: mineinabyss:ball_lightning
  lore:
  - ':layer_5: Grade II Relic'
  - <#903213>Only the battery powering this weapon is considered a Relic.
  - <#903213>The rest was added for unknown and certainly dangerous purposes.
  - <#B94018><i>Active ability. Shoots slow moving projectile on right click.
  - <#B94018><i>Projectile deals damage over time.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: ball_lightning
      length: 35s
      display: <#CCDADB>Ball Lightning
  - mythicSkills:
    - lightning_ball
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/ball_lightning
  parentModel: item/handheld
