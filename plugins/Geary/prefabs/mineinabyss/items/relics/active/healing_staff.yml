set.item:
  type: minecraft:paper
  itemName: <#808000>Symbiotic Water-shrooms
  itemModel: mineinabyss:healing_staff
  lore:
  - ':layer_4: Grade III Relic'
  - <#A3A300>Doctors have failed to reach an agreement on the safety of fungi
  - <#A3A300>like these as medicine. Their efficacy, however, is beyond doubt.
  - <#D1D100><i>Active ability. Heals user and surroundings on right click.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: healing_staff
      length: 35s
      display: <#BF2CB1>Symbiotic Water-shrooms
  - mythicSkills:
    - healing_staff
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/symbiotic_water-shrooms