set.item:
  type: minecraft:paper
  itemName: <#BF2CB1>Symbiotic Water-shrooms
  itemModel: mineinabyss:healing_staff
  lore:
  - ':layer_4: Grade III Relic'
  - <gold>Doctors have failed to reach an agreement on the safety of fungi
  - <gold>like these as medicine. Their efficacy, however, is beyond doubt.
  - <#D2D489><i>Active ability. Heals user and surroundings on right click.
observe:
