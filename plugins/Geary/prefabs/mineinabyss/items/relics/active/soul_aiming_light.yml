set.item:
  type: minecraft:paper
  itemName: <#CCDADB>Soul-aiming Light
  itemModel: mineinabyss:soul-aiming_light
  lore:
  - ':layer_5: Grade II Relic'
  - <#A0ACAD>A prototype device once wielded by the Sovereign of Dawn,
  - <#A0ACAD>discarded for unknown reasons.
  - <#7B898A><i>Active ability. Shoots multiple homing
  - <#7B898A><i>projectiles on right click.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: aiming_light
      length: 8s #change to 30-40s after testing
      display: <#CCDADB>Aiming Light
  - applyPotionEffects:
    - type: minecraft:glowing
      duration: 10s
      amplifier: 1
      hasParticles: false
    - type: minecraft:darkness
      duration: 1s
      amplifier: 1
      hasParticles: false
  - geary:shulker_bullet:
      amount: 3
      damage: 15
      radius: 20
      homing: true
      speed: 2
      duration: 40
      effects:
        - type: minecraft:glowing
          duration: 5.0t
        - type: minecraft:darkness
          duration: 3.0t
          amplifier: 1
  - mythicSkills:
    - after_image_soul-aiming_light_
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/soul-aiming_light
  parentModel: item/handheld
