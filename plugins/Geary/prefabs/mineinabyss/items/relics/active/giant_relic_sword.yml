set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:giant_relic_sword
  itemName: <#15ABC2><b>Crescent Hatchet
  lore:
  - ':layer_3: Grade I Relic'
  - <#249C9C>This Relic easily and effectively slices through the air, and even the
  - <#249C9C>Abyss itself, using its surroundings’ mysterious nature to its advantage.
  - <#195959><i>Active ability. Creates charges on right click.Takes a different
  - <#195959><i>amounts of charges to create a slash of varying strength on left click.
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentprimer;s=>=1} true
    onFail:
    - sendActionBar:
        text: <red>Not Primed
  - cooldown:
      id: cyanslash
      length: 10s
      display: <#15ABC2>Crescent Hatchet
  - mythicSkills:
    - crescent_slash
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentstop} false
    onFail:
    - sendActionBar:
        text: <red>In Cooldown  
  - cooldown:
      id: crescentprimer
      length: 1s
      display: <#617B94>Primer
  - mythicSkills:
    - crescent_primer
resourcepack:
  model: mineinabyss:item/relics/crescent_blade
