set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:giant_relic_sword
  itemName: <#15ABC2><b>Crescent Hatchet
  lore:
  - ':layer_3: Grade I Relic'
  - <#249C9C>A weapon that can tear into the fabric of the force field.
  - <#195959><i>It is known to create crescent shaped slashes damaging
  - <#195959><i>all organic matter that it comes into contact with.
  unbreakable: {}
disableItemInteractions: {}
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentprimer;s=>1} true
    onFail:
    - sendActionBar:
        text: <red>Not Primed
  - cooldown:
      id: cyanslash
      length: 10s
      display: <#15ABC2>Crescent Hatchet
  - mythicSkills:
    - crescent_slash
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentstop} false
    onFail:
    - sendActionBar:
        text: <red>In Cooldown  
  - cooldown:
      id: crescentprimer
      length: 1s
      display: <#617B94>Primer
  - mythicSkills:
    - crescent_primer
resourcepack:
  model: mineinabyss:item/relics/crescent_blade
