      id: shadowball
      length: 18s
      display: <#4c6444>Buddstone Tap
  - mythicSkills:
    - buddstone_tap
passive:
- match:
  - inHand
  every: 0.1s
  run:
  - become: parent
  - mythicSkills:
    - buddstone_tap_charge
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/buddstone_tap
  parentModel: item/handheld
