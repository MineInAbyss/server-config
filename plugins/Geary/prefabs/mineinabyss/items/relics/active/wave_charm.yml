set.item:
  itemName: <#808000>Tidal Spout
  type: minecraft:paper
  itemModel: mineinabyss:wave_charm
  lore:
  - ':layer_4: Grade III Relic'
  - <#A3A300>This Relic has found use outside of the Abyss
  - <#A3A300>among sea captains wishing to speed up their boats.
  - <#D1D100><i>Active ability. Generates a large wall of water
  - <#D1D100><i>on right click which can push back entities. 
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>1} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: tidalwave
      length: 20s
      display: <#808000>Tidal Spout
  - mythicSkills:
    - tidal_spout
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/tidal_spout
  parentModel: item/handheld  
