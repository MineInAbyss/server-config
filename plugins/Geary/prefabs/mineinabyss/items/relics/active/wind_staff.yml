set.item:
  itemName: <#FCF5E5>Gust-Shot
  type: PAPER
  itemModel: mineinabyss:wind_staff
  lore:
  - ':layer_3: Grade II Relic'
  - <gold>A key example of nature inspiring innovation, this handmade
  - <gold>Relic one-ups even the creature it was inspired by.  
  - <#D2D489><i>Active ability. Shoots a projectile on right click which
  - <#D2D489><i>explodes on hit launching entities in different directions.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>1} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: gust-shot
      length: 20s
      display: <#FCF5E5>Gust-Shot
  - mythicSkills:
    - gust-shot
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/gust-shot
  parentModel: item/handheld
