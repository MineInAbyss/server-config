set.item:
  itemName: <#4c6444>Gust-Shot
  type: minecraft:paper
  itemModel: mineinabyss:wind_staff
  lore:
  - ':layer_3: Grade II Relic'
  - <#43583c>A key example of nature inspiring innovation, this handmade
  - <#43583c>Relic one-ups even the creature it was inspired by.  
  - <#5e7b54><i>Active ability. Shoots a projectile on right click which
  - <#5e7b54><i>explodes on hit launching entities in different directions.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>1} true
      - hasaurastacks{n=gustshotcharge} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: gust-shot
      length: 20s
      display: <#4c6444>Gust-Shot
  - mythicSkills:
    - gust-shot
passive:
- match:
  - inHand
  every: 0.1s
  run:
  - become: parent
  - mythicSkills:
    - gust-shot_charge
resourcepack:
  textures:
    layers:
    - mineinabyss:item/relics/gust-shot
  parentModel: item/handheld
