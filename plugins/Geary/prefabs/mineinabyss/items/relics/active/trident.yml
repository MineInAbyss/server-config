set.item:
  itemName: <#68CCBF><b>Tranquil Pierce
  itemModel: mineinabyss:trident
  type: TRIDENT
  lore:
  - ':layer_4: Grade I Relic'
  - <#3C8C82>A spear shape object carved out of the core from
  - <#3C8C82>a Goblet of Giants containing netherworld runes.
  - <#265c55><i>It is rumored to return to the user after being thrown.
  enchantments:
    - enchant: minecraft:riptide
      level: 2
    - enchant: minecraft:impaling
      level: 5
    - enchant: minecraft:sharpness
      level: 5
  unbreakable: {}
  enchantable: 0
resourcepack:
  model: mineinabyss:item/relics/tranquil_pierce
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=trident;s=3} true
    onFail:
    - sendActionBar:
        text: <red>Out of Charge
  - cooldown:
      id: tranquilpierce
      length: 15s
      display: <#617B94>Tranquil Pierce
  - mythicSkills:
    - throwtrident
passive:
- match:
  - inHand
  every: 1s
  run:
  - become: parent
  - ensure:
      player:
        sneaking: true  
  - mythicSkills:
    - trident_charge
