set.item:
  itemName: <#1F88ED>Morinaut Shell
  type: PAPER
  itemModel: mineinabyss:respiratis
  lore:
  - ':layer_4: Grade IV Relic'
  - <gold>Cave Raiders have long tried and failed to use this Relic
  - <gold>to swim through the Sea of Corpses. Will you be the first?
  - <#D2D489><i>Active ability. Grants dolphins
  - <#D2D489><i>grace to the user on right click.
resourcepack:
  model: mineinabyss:item/relics/respiratis
observe:
  itemRightClick:
  - become: parent
  - cooldown:
      id: respiratis
      length: 35s
      display: <#1F88ED>Morinaut Shell
  - playSound:
      sound: minecraft:entity.panda.aggressive_ambient
      volume: 0.5
      pitch: 0.3
  - applyPotionEffects:
    - type: minecraft:dolphins_grace
      duration: 8s
      hasParticles: false