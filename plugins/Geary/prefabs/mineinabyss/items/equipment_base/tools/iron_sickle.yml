set.item:
  itemName: Iron Sickle
  type: minecraft:iron_hoe
  itemModel: "mineinabyss:equipment_base/tools/iron_sickle"
  maxDamage: 250
  tool:
    rules:
    - blockTypes:
      - minecraft:leaves
      speed: 8.0
      correctForDrops: true
set.recipes:
  discoverRecipes: true
  recipes:
  - type: shaped
    items:
      M: minecraft:iron_ingot
      S: minecraft:stick
    configuration: |-
      | MM|
      | SM|
      |S  |
observe:
  itemRightClick:
  - become: parent
  - mineinabyss:sickle:
      radius: 2
