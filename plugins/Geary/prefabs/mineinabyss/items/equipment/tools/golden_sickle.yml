set.item:
  itemName: Golden Sickle
  type: minecraft:golden_hoe
  itemModel: "mineinabyss:equipment/tools/golden_sickle"
  maxDamage: 32
  tool:
    rules:
    - blockTypes:
      - minecraft:leaves
      speed: 8.0
      correctForDrops: true
set.recipes:
