set.item:
  type: minecraft:paper
  itemName: <dark_aqua>Flamethrower
  itemModel: mineinabyss:flamethrower
disableItemInteractions: {}
resourcepack:
  model: mineinabyss:item/relics/flamethrower
observe:
  itemRightClick:
  - become: parent
  - ensure:
      hasConsumable:
        type: mineinabyss:flamethrower_fuel
    onFail:
    - sendActionBar:
        text: <red>Out of fuel
  - cooldown:
      id: flamethrower
      length: 2s
      display: <dark_aqua>Flamethrower
  - mythicSkills:
    - Flame-Torrent
  - consumeItem:
      type: mineinabyss:flamethrower_fuel
    when:
    - chance: 0.2
