set.item:
  itemName: <gold>Repaired Ghost Seek
  type: minecraft:paper
  itemModel: mineinabyss:ghost_seek_on
  lore:
    - <#D2D489>A mysterious device attuned to the lingering souls of the Abyss.
    - <#D2D489>Its ethereal hum grows louder as it nears a praying skeleton,
    - <#D2D489>guiding its wielder toward hidden relics.
  equippable:
    slot: HEAD
    cameraOverlay: mineinabyss:misc/ghost_seek_overlay
passive:
  - match:
      - equipped
    every: 20s
    run:
      - become: parent
      - geary:ghost_seek:
          radii:
            200:
              - mythicSkills: [ ghost_seek_effect_1 ]
            100:
              - mythicSkills: [ ghost_seek_effect_2 ]
            50:
              - mythicSkills: [ ghost_seek_effect_3 ]
            25:
              - mythicSkills: [ ghost_seek_effect_4 ]

passive:
- match:
  - inInventory
  every: 20s
  run:
    - become: parent
    - ensure:
          inSlot:
            slots: [ 9, 10 ]
            item: mineinabyss:ghost_seek_2
    - geary:ghost_seek:
        radii:
          200:
            - mythicSkills: [ ghost_seek_effect_1 ]
          100:
            - mythicSkills: [ ghost_seek_effect_2 ]
          50:
            - mythicSkills: [ ghost_seek_effect_3 ]
          25:
            - mythicSkills: [ ghost_seek_effect_4 ]

resourcepack:
  model: mineinabyss:item/relics/ghost_seek_on
