inherit:
  - mineinabyss:category_stone
  - mineinabyss:category_ore

set.item:
  type: minecraft:paper
  itemName: <white>Charcoal Sand Ore
  itemModel: mineinabyss:blocks/block/charcoal_sand_ore
set.block:
  blockType: NOTEBLOCK
  blockId: 1

resourcepack:
  parentModel: block/cube_all
  model: mineinabyss:blocks/block/charcoal_sand_ore
  textures:
    variables:
      all: mineinabyss:blocks/block/charcoal_sand_ore

blocky:pack:
  model: mineinabyss:blocks/block/charcoal_sand_ore
blocky:drops:
  acceptedToolTypes:
  - PICKAXE
  onlyDropWithCorrectTool: true
  drops:
  - item: mineinabyss:charcoal_sand_raw
    amount: 1..3
    exp: 100
    affectedByFortune: false
    silkTouchedDrop:
      prefab: mineinabyss:charcoal_sand_ore
blocky:breaking:
  hardness: 0.5
  modifiers:
    heldItems:
    - item:
        type: NETHERITE_PICKAXE
      value: 9
    - item:
        type: DIAMOND_PICKAXE
      value: 8
    - item:
        type: GOLDEN_PICKAXE
      value: 12
    - item:
        type: IRON_PICKAXE
      value: 6
    - item:
        type: STONE_PICKAXE
      value: 4
    - item:
        type: STONE_PICKAXE
      value: 2
    heldTypes:
    - toolType: PICKAXE
      value: 5
