generate-default-files: false
generate-unicode-files: true
layout:
  default:
    - backgrounds
    - vanilla
    - effect
    - orthbanking
check-update: 5
decimal-format: '#.##'
copy-pack:
  enabled: false
  path: Nexo/pack/external_packs/MythicHud.zip
boss-bar:
  max: 7
  hud-position: 4
  color: white
disable-geyser-players: true
disable-netty-injection: false
elements:
  EXPERIENCE_LEVEL: default
updaters:
  ARMOR: true
  AIR: true
  RESPAWNING: true
  EXPERIENCE: true
  CONSUMING: true
pack-support: all
default-namespace: mythichud
config-version: 9
