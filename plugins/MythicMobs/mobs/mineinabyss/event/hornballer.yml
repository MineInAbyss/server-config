
hornballer:
  Type: ZOMBIE
  Display: "<#9A1CAD>Hornballer"
  Health: 100
  Damage: 0
  SpawnCategory: event
  AIGoalSelectors:
    - clear
    - meleeattack
    - float
    - randomFly
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
  Options:
    KnockbackResistance: 1
    Collidable: true
    DigOutOfGround: true
    FollowRange: 32
    MaxCombatDistance: 128
    LockPitch: true
    Interactable: true
    MovementSpeed: 0.38
    Silent: true
    PreventSunburn: true
    PreventOtherDrops: true
  KillMessages:
  - '<target.name> was Dunked by hornballer'
  - '<target.name> was a stepping stone in hornballers legacy'
  - 'hornballer broke <target.name> knees on the court'
  - '<target.name> was finessed by hornballer'
  - '<target.name> got nothing on hornballer'
  Model:
    Id: hornballer
    ViewRadius: 48
    Drive: false
    DamageTint: true
  DamageModifiers:
    - PROJECTILE 0.5
    - FALL 0.01
  Modules:
    ThreatTable: true
  Drops:
    - exp 30-60
    - toypufferfish 1 0.04
    - potion{name="<#94bcd4>Balling Tears";lore=":troll:";enchants=THORNS:1} 1 0.06
    - amogus_token 1-3 1
    - geary mineinabyss:horncrier_horn_0 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_1 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_2 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_3 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_4 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_5 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_6 1 0.005 nolooting
    - geary mineinabyss:horncrier_horn_7 1 0.005 nolooting
    - GREEN_WOOL 1-3 0.6
  Skills:
    # - CancelEvent{sync=true} ~onAttack
    - DefaultState{m=horncrier;t=walk;s=not_in_combat} @self ~onSpawnOrLoad
    - DefaultState{m=horncrier;t=walk;s=walk} @self ~onEnterCombat
    - DefaultState{m=horncrier;t=walk;s=not_in_combat} @self ~onDropCombat
    - skill{s=Changetarget} ~onTimer:160 <99%

    - skill{s=hb_dash} @target ~onTimer:100
    - skill{s=hc_Attack2} @self ~onattack
    # - skill:MIAPetExpNearby{exp=1} ~onDeath

    # - skill{s=hc_backup} @self ~ondamaged
    - skill{s=hcAmbient;delay=<random.0to10>} @self ~onTimer:95 0.33
    - skill{s=hcHurt} @self ~onHurt
    #    - skill{s=hcDeath} @self ~onDeath

    - skill{s=displayHealth} ~onDamaged
    - skill:MIAPetExpNearby{exp=2} ~onDeath