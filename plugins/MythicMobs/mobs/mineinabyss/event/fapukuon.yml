    - DROWNING 0
    - FIRE 15
    - FIRE_TICK 3
  Skills:
    - dismount ~onTimer:20
    - shieldbreak{duration=100} @target ~onattack 0.35
    - skill{s=fapukuon_summon} @target ~onDamaged 0.05
