fapukuon:
  Type: CAVE_SPIDER
  SpawnCategory: event
  Display: "<#1FB53D>fapugatari"
  Health: 40
  Damage: 7
  AIGoalSelectors:
    - clear
    - meleeattack
    - float
    - randomstroll
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
  Options:
    PreventSunburn: true
    KnockbackResistance: 0.2
    #DigOutOfGround: true
    Collidable: true
    #Silent: false
    FollowRange: 20
    MovementSpeed: 0.42
    MaxCombatDistance: 20
    DigOutOfGround: true
    PreventOtherDrops: true
  Model:
    Id: faputa
    ViewRadius: 48
    Drive: false
    DamageTint: true
    Scale: 0.7
  DamageModifiers:
    - DROWNING 0
    - FIRE 15
    - FIRE_TICK 3
  Drops:
    - exp 15-25
    - normalchicken 1 0.02
    - amogus_token 1 0.5

  Skills:
    - skill{s=displayHealth} ~onDamaged
    - state{mid=kuongatari;s=attack} @self ~onAttack
    - skill{s=fapukuon_summon} @target ~onDamaged 0.2
    - skill{s=Changetarget} ~onTimer:160 <99%
    - shieldbreak{duration=100} @target ~onattack 0.35
    - dismount ~onTimer:20
    - skill:MIAPetExpNearby{exp=1} ~onDeath
fapugatari_summon:
  Type: SPIDER
