# @param grade: The grade of the relic, 1-4, displays a message in chat based on this
# @param item: The item to drop
relicDrop:
  TargetConditions:
    # Aura used to prevent multiple items from dropping currently, as well as particle effect
    - hasaura{aura=relicdrop} false
  Skills:
    - Aura{auraName=relicdrop;onTick=celebrate;duration=30} @trigger
    - dropitem{i=<skill.item>} @self
    # Send a message based on a grade parameter
    - message{m='<#D2D489>You hear whispers that</#D2D489><#f15d47> <trigger.name></#f15d47><#D2D489> has obtained a</#D2D489><#AA00AA> Grade I</#AA00AA><#D2D489> relic.'} @World ?stringequals{val1=<skill.grade>;val2="1"}
    - message{m='<#D2D489>You hear whispers that</#D2D489><#f15d47> <trigger.name></#f15d47><#D2D489> has obtained a</#D2D489><#AA00AA> Grade II</#AA00AA><#D2D489> relic.'} @World ?stringequals{val1=<skill.grade>;val2="2"}
    - message{m='<#D2D489>You hear whispers that</#D2D489><#f15d47> <trigger.name></#f15d47><#D2D489> has obtained a</#D2D489><#AA00AA> Grade III</#AA00AA><#D2D489> relic.'} @World ?stringequals{val1=<skill.grade>;val2="3"}
    - message{m='<#D2D489>You hear whispers that</#D2D489><#f15d47> <trigger.name></#f15d47><#D2D489> has obtained a</#D2D489><#AA00AA> Grade IV</#AA00AA><#D2D489> relic.'} @World ?stringequals{val1=<skill.grade>;val2="4"}

relicDropLamentsThread:
  TriggerConditions:
    #- chance{c=0.25} true
  Skills:
  - skill{s=relicDrop;item=LamentsThreadDrop;grade=3}

