capillary_hit:
  Cooldown:
  Conditions:
    - holding{m=NETHERITE_SWORD} true
  Skills:
  - onAttack{oH=capillary_growth_stack;cE=true;auraname=c_g_s} @self
  - skill{s=capillary_growth_kill} ~onKill
  - delay 1
  - skill{s=capillary_state_1} @self
  - delay 1
  - skill{s=capillary_state_2} @self

capillary_growth_stack:
  Cooldown:
  Skills:
  - aura{auraName=capillarygrowthstack;duration=100;c=1;maxStacks=10;cotd=false} @self
  - aura{auraName=capillarysyphonstack;oT=capillary_syphon_target;duration=100;c=1;maxStacks=1;cotd=false} @target
  - effect:particles{particle=reddust;amount=2;speed=0;y=1} @target

capillary_growth_kill:
  Cooldown: 1
  Skills:
  - heal{a=2} @self
  - effect:particles{particle=heart;amount=2;speed=0;hS=0.3;vS=0.3;y=1;size=0.5} @self

capillary_state_1:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=capillarygrowthstack;s=1to8} true
  Skills:
  - effect:particles{p=dust_color_transition;color=#A52A2A;color2=#880808;amount=5;hS=0.5;vS=1;speed=0;y=1} @self

capillary_state_2:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=capillarygrowthstack;s=9to10} true
  Skills:
  - effect:particles{p=dust_color_transition;color=#A52A2A;color2=#880808;amount=5;hS=0.5;vS=1;speed=0;y=1;size=1.5} @self

capillary_growth_effect:
  Cooldown:
  Conditions:
    - hasaurastacks{n=capillarygrowthstack;s=10} true
  Skills:
  - skill{s=capillary_growth_heal} @self
  - delay 1
  - skill{s=capillary_growth_syphon} @EIR{r=4}

capillary_syphon_target:
  Cooldown:
  Conditions:
    - hasaurastacks{n=capillarysyphonstack} true
  Skills:
  - effect:particles{particle=damage_indicator;amount=2;speed=0;hS=0.5;vS=1;y=1;size=1} @self

capillary_growth_heal:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=capillarygrowthstack;s=10} true
  Skills:
  - auraremove{aura=capillarygrowthstack} @self
  - effect:particles{particle=heart;amount=2;speed=0;hS=0.3;vS=0.3;y=1;size=0.5} @self
  - potion{t=HEALTH_BOOST;d=40} @self

capillary_growth_syphon:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=capillarysyphonstack} true
  Skills:
  - auraremove{aura=capillarysyphonstack} @self
  - effect:particles{particle=damage_indicator;amount=5;speed=0;hS=0.5;vS=1;y=1;size=1} @self
  - potion{t=WITHER;d=50;l=3} @self