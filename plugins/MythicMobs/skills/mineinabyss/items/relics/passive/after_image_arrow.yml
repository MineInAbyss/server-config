after_image_arrow:
  Cooldown:
  Conditions:
  Skills:
  - aura{auraName=afterimagearrow;onTick=after_image_shot;duration=40;c=1;maxStacks=1;cotd=false} @self

after_image_shot:
  Cooldown:
  Conditions:
  Skills:
  - onShoot{auraName=afterimageshot;onShoot=after_image_bow;duration=20;c=1}

after_image_bow:
  Cooldown:
  Conditions:
    #- bowtension{value=>0.5} true
  Skills:
  - delay 14
  #- shoot{type=ARROW;oT=after_image_tick;velocity=0.5;damage=10;pl=2} @targetlocation
  - projectile{bulletType=ARROW;arrowType=NORMAL;oT=after_image_tick;oH=after_image_hit;sB=true;sE=true;hp=true;hnp=true} @forward{f=1000}

after_image_tick:
  Cooldown:
  Conditions:
  Skills:
  - effect:particles{particle=end_rod;amount=4;hS=0.1;vS=0.1;speed=0.01}

after_image_hit:
  Cooldown:
  Conditions:
  Skills:
  - damage{a=10} @EIR{r=2}

after_image_projectile: #skill to add to all projectile based relics made: - skill{s=after_image_projectile}
  Cooldown:
  Conditions:
    - hasaurastacks{n=afterimagearrow;s=1} true
  Skills:
  - delay 14
  - projectile{onTick=after_image_tick;onHit=after_image_hit;v=30;sB=true;sE=true;hp=true;hnp=true} @forward{f=1000}
