shiver_mist:
  Skills:
  - command{c="execute at <caster.uuid> run xp add <caster.name> -80";op=true}
  - potion{t=SLOW;l=2;d=20;p=false} @Self
  - sound{s=entity.evoker.prepare_attack;sc=ui;volume=0.6;pitch=1.2;repeat=3;repeatinterval=5} @self
  - sound{s=block.enchantment_table.use;sc=ui;volume=0.5;pitch=0.8;repeat=2;repeatinterval=6} @self
  - orbital{bulletType=MOB;mob=Frost_Beam;r=0;points=1;i=1;duration=2000;oy=1.5;rx=0;ry=0;rz=0;avx=0;avy=0;avz=0} @self
  - delay 10
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=0;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=1;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=-1;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=6;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=-6;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=4;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=-4;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=3;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=-3;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=8;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=-8;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - projectile{onTick=shiver_mist_projectile_tick;onHit=shiver_mist_projectile_hit;onEnd=shiver_mist_projectile_end;v=30;i=1;mr=15;hnp=true;sE=false;sB=true;hs=false;hfs=0;syo=0.5;hR=0.5;vR=0.5;hO=0;vO=0.839;hn=1;vn=1;a=0.8;g=0.6} @Forward{f=1000}
  - skill{s=after_image_shiver_mist} #skill from after_image_arrow
  - sound{s=entity.ender_dragon.flap;sc=ui;volume=0.3;pitch=1.6;repeat=2;repeatinterval=3} @self
  - sound{s=entity.wither.shoot;sc=ui;volume=0.1;pitch=1.5;repeat=2;repeatinterval=2} @self
  - throw{velocity=9;velocityY=4} @EntitiesInCone{r=1;a=45}
  - throw{velocity=7;velocityY=3;delay=5} @EntitiesInCone{r=1to2;a=45}
  - throw{velocity=5;velocityY=2;delay=10} @EntitiesInCone{r=2to3;a=45}
  - delay 4
  - freeze{ticks=80} @self #might not work without aura, to be changed to skill on chance its broken after testing
  - potion{t=SLOW;l=2;d=20;p=false} @self
  - extinguish{delay=0} @self @cone

shiver_mist_projectile_tick:
  Skills:
  - effect:particles{particle=redstone;color=#94d4ff;amount=10;hS=0.12;vS=0.12;speed=0;forwardOffset=0;sideOffset=0} @origin
  - effect:particles{particle=redstone;color=#edfaff;amount=10;hS=0.12;vS=0.12;speed=0;forwardOffset=0;sideOffset=0} @origin
  - effect:particles{particle=small_gust;color=#edfaff;amount=2;hS=0.25;vS=0.25;speed=0;forwardOffset=0;sideOffset=0} @origin

shiver_mist_projectile_end:
  TargetConditions:
  Skills:
  - effect:particles{particle=snowflake;amount=2;hS=1;vS=1;speed=0;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin

shiver_mist_projectile_hit:
  TargetConditions:
  Skills:
  - aura{auraName=shivermistfreeze;onStart=shiver_mist_projectile_hit_fx;onTick=shiver_mist_freeze_effect;duration=40;i=10;c=1;maxStacks=40;cotd=false;cod=true;rd=true} @EIR{r=1}
  - damage{a=3;pkb=true} @EntitiesNearOrigin{r=1}
  - potion{type=SLOW;duration=40;level=2;hasParticles=false} @EntitiesNearOrigin{r=2}
  - extinguish{delay=1} @EIR{r=2}

shiver_mist_projectile_hit_fx:
  Skills:
  - effect:particles{particle=block_crack;m=ICE;amount=3;hS=0.2;vS=0.2;speed=0;forwardOffset=0;sideOffset=0} @origin

shiver_mist_freeze_effect:
  Cooldown:
  Conditions:
    - hasaurastacks{n=shivermistfreeze} true
  Skills:
  - effect:particles{particle=block_crack;m=ICE;amount=5;hS=0.35;vS=0.35;y=0.1;speed=0;forwardOffset=0;sideOffset=0} @origin
  - skill{s=shiver_mist_freeze_effect_1}
  - delay 1
  - skill{s=shiver_mist_freeze_effect_2}
  - delay 1
  - skill{s=shiver_mist_freeze_effect_3}
  - delay 1
  - skill{s=shiver_mist_freeze_effect_4}

shiver_mist_freeze_effect_1:
  Cooldown:
  Conditions:
    - hasaurastacks{n=shivermistfreeze;s=1to10} true
  Skills:
  - potion{type=SLOW;duration=40;level=2;hasParticles=false} @self

shiver_mist_freeze_effect_2:
  Cooldown:
  Conditions:
    - hasaurastacks{n=shivermistfreeze;s=11to20} true
  Skills:
  - effect:particles{particle=item_snowball;amount=2;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - potion{type=SLOW;duration=40;level=3;hasParticles=false} @self
  - freeze{ticks=40} @self
  - damage{a=0.5;ia=false;pkb=true} @self

shiver_mist_freeze_effect_3:
  Cooldown:
  Conditions:
    - hasaurastacks{n=shivermistfreeze;s=21to30} true
  Skills:
  - effect:particles{particle=item_snowball;amount=3;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - effect:particles{particle=snowflake;amount=1;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - potion{type=SLOW;duration=40;level=3;hasParticles=false} @self
  - freeze{ticks=40} @self
  - damage{a=0.5;ia=true;pkb=true} @self

shiver_mist_freeze_effect_4:
  Cooldown:
  Conditions:
    - hasaurastacks{n=shivermistfreeze;s=31to40} true
  Skills:
  - effect:particles{particle=item_snowball;amount=3;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - effect:particles{particle=snowflake;amount=2;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - potion{type=SLOW;duration=40;level=4;hasParticles=false} @self
  - freeze{ticks=40} @self
  - damage{a=1;ia=true;pkb=true} @self



