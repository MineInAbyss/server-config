  - skill{s=petrifying_stone_charge_}
petrifying_stone_charge_:
  Cooldown:
  Conditions:
  Skills:
  - aura{auraName=petrifyingstonecharge;duration=3;c=1;maxStacks=1;cotd=false;rd=true} @self