  - sound{s=entity.player.attack.crit;volume=0.8;pitch=0.6;cooldown=1} @origin

buddstone_tap:
  Conditions:
  Cooldown: 1
  Skills:
  - potion{t=SLOW;l=3;d=50;p=false} @Self
  #- sound{s=entity.witch.celebrate;p=1.9;v=1} @Self
  - sound{s=entity.evoker.prepare_summon;p=0.8;v=0.5} @Self
  - delay 40
  - skill{s=buddstone_tap_projectile}

