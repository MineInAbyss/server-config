####################################################################
##################### Left Click Ability ###########################
####################################################################

yukonokage_hit: # Shim for geary
  Skills:
  - skill{s=yukonokage_hit_}
yukonokage_hit_:
  Conditions:
  - holding{m=NETHERITE_SWORD} true
  - variableisset{n=caster.yukonokage_lock_hit} false
  Skills:
  - variableset{n=caster.yukonokage_lock_hit;val=0}
  - skill{s=yukonokage_init_vars}
  - onAttack{oH=yukonokage_stack;cE=false;auraname=y_h_s}
  - pull{velocity=1} @target
  - delay 1
  - skill{s=yukonokage_soul_overload}
  - variableunset{n=caster.yukonokage_lock_hit}

yukonokage_init_vars:
  Conditions:
  - variableisset{var=caster.yukonokage_stacks} false
  Skills:
  - setvariable{var=caster.yukonokage_stacks;val=0}

yukonokage_reset:
  Skills:
  - sound{s=entity.allay.death;sc=ui;p=0.6;v=0.7} @self
  - variableset{n=caster.yukonokage_stacks;val=0}
  - variableunset{n=caster.yukonokage_lock_display}
  - variableunset{n=caster.yukonokage_lock_hit}
  - variableunset{n=caster.yukonokage_lock_ability}

yukonokage_stack:
  Cooldown: 0.6 # Cooldown field is in seconds, accounts for sword attack cooldown
  Conditions:
  - variableisset{var=caster.yukonokage_stacks} true
  TargetConditions:
  - mythicmobtype{t=yukonokage_soul_wisp} false # Don't stack on orbitals
  Skills:
  - variableadd{var=caster.yukonokage_stacks;amount=1}
  - onDeath{od=yukonokage_kill} @EIR{r=5}
  - effect:particles{particle=reverse_portal;amount=2;speed=10;y=1} @target
  
yukonokage_kill:
  Conditions:
  - variableisset{var=caster.yukonokage_stacks} true
  Skills:
  - variableadd{var=caster.yukonokage_stacks;amount=20}
  - effect:particles{particle=soul;amount=20;speed=0.4;y=1} @target
  - sound{s=entity.allay.death;sc=ui;p=0.6;v=0.7} @self

yukonokage_soul_overload:
  Conditions:
  - variableisset{var=caster.yukonokage_stacks} true
  - variableinrange{var=caster.yukonokage_stacks;value=>=220} true
  Skills:
  - effect:blockmask{m=SNOW_BLOCK;r=2;d=150} @self
  - effect:particlesphere{particle=poof;amount=5;radius=3;hS=1;vS=0.5;s=10} @self
  - effect:particlesphere{particle=reverse_portal;amount=5;radius=3;hS=1;vS=0.5;s=10} @self
  - sound{s=entity.allay.death;sc=ui;p=10;v=0.3} @self
  - sound{s=entity.allay.death;sc=ui;p=105;v=0.2} @self
  - sound{s=entity.allay.death;sc=ui;p=0.2;v=1.8} @self
  - delay 5
  - effect:blockmask{m=SNOW_BLOCK;r=3;d=150} @self
  - effect:particlesphere{particle=poof;amount=10;radius=3;hS=1;vS=0.5;s=10} @self
  
  - aura{d=300;i=20;onTick=soul_overload_freeze_effect} @EIR{r=4}
  - aura{d=300;i=20;onTick=soul_overload_freeze_effect} @self

  - throw{velocity=30;velocityY=5} @EIR{r=3.5}
  - delay 5
  - effect:blockmask{m=SNOW_BLOCK;r=4;d=150} @self
  - effect:particlesphere{particle=poof;amount=15;radius=4;hS=1;vS=0.5;s=10} @self
  - setvariable{var=caster.yukonokage_stacks;val=0}

soul_overload_freeze_effect:
  Skills:
  - effect:particles{particle=item_snowball;amount=3;hS=0.35;vS=0.35;y=0.5;speed=0.1;forwardOffset=0;sideOffset=0;dir=0,-1,0} @origin
  - sound{s=block.glass.break;sc=ui;volume=0.1;pitch=1.5} @origin
  - freeze{ticks=80} @targetedtarget
  - damage{a=4;ie=true;is=true} @targetedtarget
  - freeze{ticks=80} @self
  - damage{a=4;ie=true;is=true} @self

####################################################################
##################### Right Click Ability ##########################
####################################################################
yukonokage_ability: # Shim for geary
  Skills:
  - skill{s=yukonokage_ability_}
yukonokage_ability_:
  Conditions:
  - variableisset{var=caster.yukonokage_stacks} true
  - variableisset{var=caster.yukonokage_lock_ability} false
  Skills:
  - variableset{n=caster.yukonokage_lock_ability;val=0}
  - skill{s=yukonokage_soul_shot}
  - delay 1
  - skill{s=yukonokage_soul_repel}
  - delay 1
  - variableunset{n=caster.yukonokage_lock_ability}

yukonokage_soul_shot:
  Conditions:
  - (variableinrange{var=caster.yukonokage_stacks;value=20to79} true || (variableinrange{var=caster.yukonokage_stacks;value=>=80} true && issneaking false))
  Skills:
  - sound{s=block.bell.resonate;sc=ui;volume=0.55;pitch=1.6} @self
  - sound{s=block.bell.resonate;sc=ui;volume=0.55;pitch=1.8} @self
  - particle{p=flash;amount=1} @Forward{f=2}
  - particlelinehelix{p=reddust;color=#78e4ff;fo=true;db=0.25;hl=4;syo=0.9;hr=1.5;md=40} @Forward{f=1000} # or orbital around the projectile
  - particlelinehelix{p=reddust;color=#f1a8ff;fo=true;db=0.25;hl=4;syo=0.9;hr=1.5;md=40;rot=180} @Forward{f=1000} # or orbital around the projectile
  - projectile{bulletType=MOB;mob=yukonokage_soul_wisp_1;syo=0.9;byo=0;hnp=true;oH=yukonokage_soul_collision;v=40;hR=1.5;vR=1.5;sE=false} @Forward{f=1000}
  - variablesubtract{var=caster.yukonokage_stacks;amount=20}

yukonokage_soul_collision:
  Skills:
  - sound{s=entity.allay.hurt;sc=ui;p=1;v=0.6} @targetedtarget
  - sound{s=entity.allay.hurt;sc=ui;p=1.5;v=0.6} @targetedtarget
  - sound{s=entity.allay.hurt;sc=ui;p=0.2;v=0.6} @targetedtarget
  - damage{a=7;ie=true;ia=true;is=true} @targetedtarget{ignore=animal,creature,monster} 
  - damage{a=clamp(<target.mhp> * 0.15,10,50);ie=true;ia=true} @targetedtarget{ignore=player} 

yukonokage_soul_repel:
  Conditions:
  - variableinrange{var=caster.yukonokage_stacks;value=>=80} true
  - issneaking true
  Skills:
  - sound{s=block.bell.resonate;sc=ui;volume=0.55;pitch=1.6} @self
  - sound{s=block.bell.resonate;sc=ui;volume=0.55;pitch=1.8} @self
  - sound{s=block.conduit.deactivate;sc=ui;volume=0.55;pitch=1.8} @self
  - aura{d=80;i=5;onTick=soul_repel_effect} @self
  - variablesubtract{var=caster.yukonokage_stacks;amount=80}

soul_repel_effect:
  Skills:
  - effect:particlering{p=snowflake;r=4;points=100;amount=2;y=1}
  - effect:particlering{p=snowflake;r=4;points=100;amount=2}
  - effect:particlering{p=reddust;r=3;color=#78e4ff;points=75;amount=1;y=1}
  - effect:particlering{p=reddust;r=3;color=#78e4ff;points=75;amount=1}
  - freeze{ticks=40} @EIR{r=4}
  - throw{velocity=20;velocityY=4} @EIR{r=3;ignore=animal,creature,monster} # Can adjust later if needed for players
  - throw{velocity=20;velocityY=4} @EIR{r=3;ignore=player}

