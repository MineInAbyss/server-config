yukonokage_soul_display_1:
  Conditions:
  - variableinrange{var=caster.yukonokage_stacks;value=20to39} true
  Skills:
  - sound{s=entity.wither_skeleton.ambient;sc=players;p=1;v=0.6} @self
  - orbital{auraName=yukonokageskull1;oT=yukonokage_soul_tick;hp=false;bullet=DISPLAY;bulletmaterial=WITHER_SKELETON_SKULL;rotate=true;interval=1;duration=9999;oy=1;scale=1,1,1;maxStacks=1;radius=2;sp=<random.0to10>;onEnd=yukonokage_skull_end;cao=True;hE=false} @self

