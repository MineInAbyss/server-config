crescent_slash:
  Cooldown:
  Skills:
  - skill{s=crescent_slash_1} @self
  - delay 1
  - skill{s=crescent_slash_2} @self
  - delay 1
  - skill{s=crescent_slash_3} @self
  - delay 1
  - skill{s=crescent_slash_4} @self

crescent_slash_1:
  Conditions:
    - hasaurastacks{n=crescentprimer;s=1to2} true
  Skills:
  - auraremove{aura=crescentprimer;stacks=1} @self
  - randomskill{skills=slash_1,slash_2}
  - totem{md=2;c=1;oH=slash_damage;hnp=true;hp=true;hR=2;vR=2;i=1} @forward{f=1}
  - delay 1
  - aura{auraName=crescentstop;duration=200;c=1;cotd=false} @self

crescent_slash_2:
  Conditions:
    - hasaurastacks{n=crescentprimer;s=3to4} true
  Skills:
  - auraremove{aura=crescentprimer;stacks=3} @self
  - aura{auraName=crescentstop;duration=200;c=1;cotd=false} @self
  - delay 4
  - projectile{bulletType=MOB;mob=Tidal_Wave;onHit=crescent_hit_2;v=12;i=1;hR=1.5;vR=1.5;mr=5;hnp=true;hp=true;hO=0;sE=false;sB=true;d=60;hs=false;hfs=1} @targetlocation

crescent_slash_3:
  Conditions:
    - hasaurastacks{n=crescentprimer;s=5to6} true
  Skills:
  - auraremove{aura=crescentprimer;stacks=5} @self
  - aura{auraName=crescentstop;duration=200;c=1;cotd=false} @self
  - delay 4
  - projectile{bulletType=MOB;mob=Tidal_Wave;onHit=crescent_hit_3;v=14;i=1;hR=1.5;vR=1.5;mr=15;hnp=true;hp=true;hO=0;sE=false;sB=true;d=80;hs=false;hfs=1} @targetlocation

crescent_slash_4:
  Conditions:
    - hasaurastacks{n=crescentprimer;s=>7} true
  Skills:
  - skill{s=crescent_debuff}
  - delay 1
  - auraremove{aura=crescentprimer;stacks=10} @self
  - aura{auraName=crescentstop;duration=200;c=1;cotd=false} @self
  - delay 4
  - projectile{bulletType=MOB;mob=Tidal_Wave;onHit=crescent_hit_3;v=16;i=1;hR=1.5;vR=1.5;mr=25;hnp=true;hp=true;hO=0;sE=false;sB=true;d=150;hs=false;hfs=1} @targetlocation

crescent_debuff:
  Conditions:
    - hasaurastacks{n=crescentprimer;s>=7} true
  Skills:
  - effect:particles{p=flash;amount=3;hS=0.3;vS=0.3;speed=0;y=0.5} @forward{f=1}
  - damage{a=30;pkb=false;hnp=false;hp=true;pi=true} @self
  - delay 4
  - lunge{velocity=1.25;velocityY=0.5} @forward{f=-4;y=-2}
  - delay 1
  - aura{auraName=crescentstop;duration=200;c=1;cotd=false} @self

slash_1:
  Conditions:
  Skills:
  - sound{s=entity.player.attack.sweep;volume=0.7;pitch=1.6} @self # Quick sword slash
  - sound{s=block.water.splash;volume=0.6;pitch=1.4} @self         # Small water splash
  - sound{s=item.trident.riptide_1;volume=0.35;pitch=1.7} @self     # Fast water swoosh
  - summon{type=CyanSwings_2;amount=1;radius=0;yRadius=0;onSurface=true} @forward{f=1;y=0.3}

slash_2:
  Conditions:
  Skills:
  - sound{s=entity.player.attack.sweep;volume=0.7;pitch=1.6} @self # Quick sword slash
  - sound{s=block.water.splash;volume=0.6;pitch=1.4} @self         # Small water splash
  - sound{s=item.trident.riptide_1;volume=0.35;pitch=1.7} @self     # Fast water swoosh
  - summon{type=CyanSwings_3;amount=1;radius=0;yRadius=0;onSurface=true} @forward{f=1;y=0.3}

slash_damage:
  Skills:
  - damage{a=20;pkb=false;hnp=false;hp=true;pi=true}

crescent_hit_2:
  Skills:
  - damage{a=25;pkb=false;hnp=false;hp=true;pi=true}

crescent_hit_3:
  Skills:
  - damage{a=30;pkb=false;hnp=false;hp=true;pi=true}

crescent_hit_4:
  Skills:
  - damage{a=40;pkb=false;hnp=false;hp=true;pi=true}

crescent_primer:
  Cooldown: 0
  Conditions:
    - hasaurastacks{n=crescentstop;s=1} false
  Skills:
  - aura{auraName=crescentprimer;onStart=crescent_start;duration=120;c=1;maxStacks=10;cotd=true;rd=true} @self
  - sound{s=entity.leash_knot.place;p=0.3;v=0.6} @self
  - sound{s=entity.leash_knot.place;p=0.15;v=0.5} @self
  - effect:particles{p=enchant;amount=10;hS=0.3;vS=0.3;speed=0;y=0.5} @self
  - skill{s=crescent_slash_1_charged} @self
  - delay 1
  - skill{s=crescent_slash_2_charged} @self
  - delay 1
  - skill{s=crescent_slash_3_charged} @self
  - delay 1
  - skill{s=crescent_slash_4_charged} @self

crescent_slash_1_charged:
  Cooldown: 5
  Conditions:
    - hasaurastacks{n=crescentprimer;s=1to2} true
  Skills:
  - effect:particles{p=end_rod;amount=2;hS=0.5;vS=1;speed=0;y=0.5}

crescent_slash_2_charged:
  Cooldown: 5
  Conditions:
    - hasaurastacks{n=crescentprimer;s=3to4} true
  Skills:
  - effect:particles{p=end_rod;amount=5;hS=0.5;vS=1;speed=0;y=0.5}

crescent_slash_3_charged:
  Cooldown: 5
  Conditions:
    - hasaurastacks{n=crescentprimer;s=5to6} true
  Skills:
  - effect:particles{p=end_rod;amount=7;hS=0.5;vS=1;speed=0;y=0.5}

crescent_slash_4_charged:
  Cooldown: 5
  Conditions:
    - hasaurastacks{n=crescentprimer;s=>7} true
  Skills:
  - effect:particles{p=end_rod;amount=10;hS=0.5;vS=1;speed=0;y=0.5}
