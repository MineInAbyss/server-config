reverberating_edge_hit: # Shim for geary
  Skills:
  - skill{s=reverberating_edge_hit_}
reverberating_edge_hit_:
  Cooldown: 
  Conditions:
  Skills:
  - onAttack{oH=reverberating_edge_stack;cE=false;auraname=r_e_s} @self
  - skill{s=reverberating_edge_vibrate_1}
  - delay 1
  - skill{s=reverberating_edge_vibrate_2}
  - delay 1
  - skill{s=reverberating_edge_vibrate_3}
  - delay 1
  - skill{s=reverberating_edge_vibrate_4}

reverberating_edge_stack:
  Cooldown: 0.6 #cooldown accounts for sword attack cooldown
  Conditions:
  Skills:
  - aura{auraName=reverberatingedgestack;duration=100;c=1;maxStacks=10;cotd=false;rd=true} @self
  - effect:particles{particle=instant_effect;amount=2;speed=0;y=1} @target

reverberating_edge_vibrate_1:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=reverberatingedgestack;s=1to3} true
  Skills:
  - effect:particles{particle=ash;amount=5;hS=0.5;vS=1;speed=0;y=0.5} @self

reverberating_edge_vibrate_2:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=reverberatingedgestack;s=4to6} true
  Skills:
  - effect:particles{particle=ash;amount=5;hS=0.5;vS=1;speed=0;y=0.5;size=1.5} @self

reverberating_edge_vibrate_3:
  Cooldown: 
  Conditions:
    - hasaurastacks{n=reverberatingedgestack;s=7to8} true
  Skills:
  - effect:particles{p=falling_dust;material=STONE;amount=5;hS=0.5;vS=1;speed=0;y=0.5} @self
  - totem{md=2;c=1;oH=reverberating_edge_vibrate_3_damage;hnp=true;hp=true;hR=2;vR=2;i=1} @forward{f=1}
  #- sound{s=block.bone_block.step;sc=ui;p=4;v=0.4} @self #sound only if we can find a good reverb type sound

reverberating_edge_vibrate_4:
  Cooldown:
  Conditions:
    - hasaurastacks{n=reverberatingedgestack;s=9to10} true
  Skills:
  - effect:particles{p=falling_dust;material=STONE;amount=10;hS=0.5;vS=1;speed=0;y=0.5;size=1.5} @self
  - totem{md=2;c=1;oH=reverberating_edge_vibrate_4_damage;hnp=true;hp=true;hR=2;vR=2;i=1} @forward{f=1}
  - sound{s=block.sculk_catalyst.place;sc=ui;p=2;v=0.55} @self #sound only if we can find a good reverb type sound

reverberating_edge_vibrate_3_damage:
  Cooldown:
  Conditions:
  Skills:
  - damage{a=2} @EIR{r=2}

reverberating_edge_vibrate_4_damage:
  Cooldown:
  Conditions:
  Skills:
  - damage{a=3} @EIR{r=2}

