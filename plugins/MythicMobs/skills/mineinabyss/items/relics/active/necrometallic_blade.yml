necrometallic_blade_hit: # Shim for geary
  Skills:
  - skill{s=necrometallic_hit__}
  - delay 1
  - skill{s=necrometallic_chipping_spores}
necrometallic_hit__:
  Cooldown: 0.6 #to account for minecraft sword attack cooldown
  Conditions:
    - isblocking false
  Skills:
  - onAttack{auraName=necrometallicdebuff;onTick=necrometallic_tick;i=20;duration=101;c=1;maxStacks=30;cotd=false;cod=true;cocd=true;rd=true} @target #aura skills in necrometallic_sledge
  - skill{s=necrometallic_blade_effect_main} @self #skill does smth smth

necrometallic_chipping_spores:
  Cooldown: 0.6 #to account for minecraft sword attack cooldown
  Conditions:
    - chance{chance=0.1} true
  Skills:
  - summonareaeffectcloud{p=glow_squid_ink;d=60;r=1;type=POISON;l=0;pd=60} @self

necrometallic_blade_effect_main:
  Cooldown:
  Conditions:
    - hasaurastacks{n=necrometallic_blade;s=3} true
  Skills:
  #potion cloud type particle and poison dmg

necrometallic_blade: #dunno yet, probs to be deleted
  Conditions:
    - hasaurastacks{n=necrometallic_blade;s=1} true
  Cooldown: 1
  Skills:
  - auraremove{aura=necrometallic_blade} @self
  - aura{auraName=necrometallic_blade_poison;oT=necrometallic_blade_tick;duration=200;maxStacks=1;interval=25} @self

necrometallic_blade_tick: #dunno yet, probs to be deleted
  Skills:
    - sound{s=entity.creeper.hurt;sc=ui;p=<random.float.0.2to0.5>;v=0.7} @self
    - damage{a=5;pi=true} @EntitiesNearOrigin{r=6;ignore=players}
    - effect:particles{particle=campfire_signal_smoke;amount=100;hS=3;vS=1;y=0.5}
    - effect:particles{particle=glow_squid_ink;amount=20;hS=3;vS=1;y=0.5}
    - effect:particles{particle=large_smoke;amount=20;hS=3;vS=1;y=0.5}
    - effect:particles{particle=sneeze;amount=200;hS=3;vS=1;y=0.5}
    - effect:particles{particle=spore_blossom_air;amount=20;hS=3;vS=1;y=0.5}
    - effect:particles{particle=trial_omen;amount=75;hS=3;vS=1;y=1}

necrometallic_blade_charge: # Shim for geary
  Skills:
  - skill{s=necrometallic_blade_charge_}
necrometallic_blade_charge_:
  Conditions:
    - hasaurastacks{n=necrometallicbladestop;s=1} true
  Skills:
    - skill{s=necrometallic_blade_effect_sub} @self #skill does smth smth
    - delay 1
    - aura{auraName=necrometallicbladecharge;duration=200;maxStacks=3;cotd=false;cod=true;rd=true} @self
    - skill{s=necrometallic_blade_1} @self
    - delay 1
    - skill{s=necrometallic_blade_2} @self
    - delay
    - skill{s=necrometallic_blade_3} @self

