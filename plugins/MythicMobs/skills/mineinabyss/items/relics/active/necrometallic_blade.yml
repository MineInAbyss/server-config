  - effect:particles{particle=sneeze;amount=10;hS=2;vS=0.5;speed=0;forwardOffset=0;sideOffset=0} @self
  - effect:particles{particle=spore_blossom_air;amount=10;hS=2;vS=0.5;speed=0.5;forwardOffset=0;sideOffset=0;size=1.5} @self
