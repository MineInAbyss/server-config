necrometallic_blade_charge_:
  Conditions:
  Skills:
    - skill{s=necrometallic_blade_effect_sub} @self
    - delay 1
    - aura{auraName=necrometallicbladecharge;duration=200;maxStacks=3;cotd=false;cod=true;rd=true} @self
    - skill{s=necrometallic_blade_charge_1} @self
    - delay 1
    - skill{s=necrometallic_blade_charge_2} @self
    - delay
    - skill{s=necrometallic_blade_charge_3} @self

