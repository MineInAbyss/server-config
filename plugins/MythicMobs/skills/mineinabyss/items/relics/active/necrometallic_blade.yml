necrometallic_blade_hit: # Shim for geary
  Skills:
  - skill{s=necrometallic_blade_hit_}
  - delay 1
  - skill{s=necrometallic_chipping_spores} #needs to be moved from totem to mob
  - delay 1
  - skill{s=necrometallic_blade_effect_main}
necrometallic_blade_hit_:
  Cooldown: 0.6 #to account for minecraft sword attack cooldown
  TargetConditions:
    - isblocking false
  Skills:
   - onAttack{auraName=necrometallicbladevulnerable;oa=necrometallic_blade_vulnerable;cE=false} #aura skills in necrometallic_sledge

necrometallic_chipping_spores:
  Cooldown: 0.6 #to account for minecraft sword attack cooldown
  Conditions:
    - chance{chance=0.1} true
  Skills:
  - totem{charges=3;i=20;md=60;onTick=necrometallic_chipping_spores_effect;hs=true;hugwater=true;hfs=0.1;hp=true;hnp=true;hitSelf=true} @self

necrometallic_chipping_spores_effect:
  TargetConditions:
  Skills:
  - effect:particlering{particle=reddust;color=#FF5C5C;y=-0.5;amount=2;r=1.5;p=15;hS=1;vS=0.12;speed=0;forwardOffset=0;sideOffset=0;size=0.4} @origin
  - effect:particlering{particle=reddust;color=#FDE55D;y=-0.5;amount=2;r=1.5;p=15;hS=1;vS=0.12;speed=0;forwardOffset=0;sideOffset=0;size=0.4} @origin
