yukonokage_hit:
  Cooldown: 
  Conditions:
    - holding{m=NETHERITE_SWORD} true
  Skills:
  - onAttack{oH=yukonokage_stack;cE=false;auraname=y_h_s} @self
  - pull{velocity=1} @target
  - delay 1
  - skill{s=yukonokage_soul_overload}

yukonokage_stack:
  Cooldown: 12 #cooldown accounts for sword attack cooldown
  Conditions:
  Skills:
  - aura{auraName=yukonokagestack;duration=9999;c=1;maxStacks=220;cotd=false;rd=true;cod=true} @self
  - aura{auraName=yukonokagestack;duration=9999;c=20;maxStacks=220;cotd=false;rd=true;cod=true} ~onKill
  - effect:particles{particle=reverse_portal;amount=2;speed=0.1;y=1} @target
  - effect:particles{particle=soul;amount=2;speed=0.4;y=1} @target ~onKill
  - sound{s=ambient.soul_sand_valley.voices;p=0.6;v=0.7} @target ~onKill

yukonokage_soul_overload:
  Conditions:
    - hasaurastacks{n=yukonokagestack;s=>201} true
  Skills:
  - effect:blockmask{m=SNOW_BLOCK;r=2;d=150} @self
  - effect:particlesphere{particle=poof;amount=5;radius=2;hS=1;vS=0.5;s=0.1} @self
  - effect:particlesphere{particle=reverse_portal;amount=5;radius=2;hS=1;vS=0.5;s=0.1} @self
  - sound{s=ambient.soul_sand_valley.voices;p=0.1;v=0.8} @self
  - sound{s=ambient.soul_sand_valley.voices;p=0.15;v=0.7} @self
  - sound{s=ambient.soul_sand_valley.voices;p=0.2;v=0.6} @self
  - delay 5
  - effect:blockmask{m=SNOW_BLOCK;r=3;d=150} @self
  - effect:particlesphere{particle=poof;amount=10;radius=3;hS=1;vS=0.5;s=0.1} @self
  - skill{soul_overload_freeze}
  - throw{velocity=30;velocityY=5} @EIR{r=3}
  - delay 5
  - effect:blockmask{m=SNOW_BLOCK;r=4;d=150} @self
  - effect:particlesphere{particle=poof;amount=15;radius=4;hS=1;vS=0.5;s=0.1} @self
  - auraremove{aura=yukonokagestack} @self

soul_overload_freeze:
  Skills:
  - aura{d=300;i=20;onTick=soul_overload_freeze_effect} @EIR{r=4}
  - aura{d=300;i=20;onTick=soul_overload_freeze_effect} @self

soul_overload_freeze_effect:
  Skills:
  - freeze{ticks=30} @self
  - damage{a=4;ie=true} @self

yukonokage_ability:
  Conditions:
    - hasaurastacks{n=yukonokagestack;s=>20} true
  Skills:
  - skill{s=yukonokage_soul_shot}
  - delay 1
  - skill{s=yukonokage_soul_repel}

yukonokage_soul_shot:
  Conditions:
    - hasaurastacks{n=yukonokagestack;s=>20} true
  Skills:
  - shootskull{y=2;v=4} @targetlocation
  #particles
  #sound
  - delay 1
  - auraremove{aura=yukonokagestack;s=20} @self

yukonokage_soul_repel:
  Conditions:
    - hasaurastacks{n=yukonokagestack;s=>80} true
    - issneaking true
  Skills:
  - aura{d=80;i=1;onTick=soul_repel_effect;cod=true} @self
  - delay 1
  - auraremove{aura=yukonokagestack;s=80} @self

soul_repel_effect:
  Skills:
  #particles
  #sound
  - freeze{ticks=30} @EIR{r=3}
  - throw{velocity=20;velocityY=4} @EIR{r=3}

