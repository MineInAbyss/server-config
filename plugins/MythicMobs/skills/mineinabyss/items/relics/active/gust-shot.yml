gust-shot:
  Cooldown: 1
  Skills:
  - potion{type=SLOW;duration=35;level=2;p=false;force=true} @Self
  - effect:particles{particle=dust_plume;amount=9;y=0.5;size=2}
  - sound{s=block.roots.break;sc=ui;p=0.5;v=0.8;repeat=4;repeatInterval=3} @self
  - delay 20
  - skill{s=gust-shot_projectile}

gust-shot_projectile:
  Cooldown:
  Conditions:
    - hasaurastacks{n=gustshotcharge} true
  Skills:
  - sound{s=entity.blaze.shoot;sc=ui;p=1.1;v=0.7} @self
  - sound{s=entity.ender_dragon.flap;sc=ui;p=0.6;v=0.7} @self
  - sound{s=entity.ghast.shoot;sc=ui;p=<random.float.0.8to1.0>;v=0.8} @self
  - sound{s=block.metal.break;sc=ui;p=1.3;v=0.6} @self
  - command{c="execute at <caster.uuid> run xp add <caster.name> -40";op=true}
  - projectile{onTick=windstaff_tick;onHit=wind_impact;onEnd=wind_impact;v=10;i=1;hR=1;vR=1;hnp=true;tyo=0.5;syo=1.5} @forward{f=1000}
  - skill{s=after_image_gust-shot} #skill from after_image_arrow

windstaff_tick:
  Skills:
  - effect:particles{particle=cloud;amount=9;hS=.1;vS=.1;speed=0.01}

wind_impact:
  Skills:
  - effect:particles{p=gust_emitter_large;a=1;vs=0.2;hs=0.2;s=0;y=1;size=1.5}
  - fakeexplosion
  - totem{md=2;c=1;oT=wind_impact_effect;hnp=true;hp=true;hR=2;vR=2;i=1;hitSelf=true} @origin
  - shieldbreak{duration=150}

wind_impact_effect:
  Skills:
  - throw{velocity=14;velocityY=7} @EIR{r=4}
  - damage{a=20} @EIR{r=4}
  - damage{a=30} @EIR{r=2;conditions=[
                              - entitywithin{d=2} true     ]}

gust-shot_charge: # Shim for geary
  Skills:
  - skill{s=gust-shot_charge_}
gust-shot_charge_:
  Cooldown:
  Conditions:
  Skills:
  - aura{auraName=gustshotcharge;duration=3;c=1;maxStacks=1;cotd=false;rd=true} @self