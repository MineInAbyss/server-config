yunokage_click:
  Skills:
  - onAttack{auraName=yunokage_hit_track_0;onHit=yunokage_hit_0;duration=100} @self

yunokage_hit_0:
  Skills:
  - sound{s=entity.wither_skeleton.ambient;sc=players;p=1;v=0.6} @self
  - orbital{auraName=yunokage_skull_0;hp=false;bullet=DISPLAY;bulletmaterial=WITHER_SKELETON_SKULL;rotate=true;interval=1;duration=100;oy=1;scale=1,1,1;maxStacks=10;radius=2;sp=<random.0to10>;onEnd=yunokage_skull_end;cao=True} @self
  - onAttack{auraName=yunokage_hit_track_1;onHit=yunokage_hit_1;duration=100} @self

