  - sound{s=entity.blaze.shoot;sc=players;p=1;v=0.6} @self
  - auraremove{aura=yunokage_skull_0}
  - auraremove{aura=yunokage_skull_1}
  - auraremove{aura=yunokage_skull_2}
  - auraremove{aura=yunokage_skull_3}
  - auraremove{aura=yunokage_skull_4}
  - auraremove{aura=yunokage_hit_track_0}
  - auraremove{aura=yunokage_hit_track_1}
  - auraremove{aura=yunokage_hit_track_2}
  - auraremove{aura=yunokage_hit_track_3}
  - auraremove{aura=yunokage_hit_track_4}

