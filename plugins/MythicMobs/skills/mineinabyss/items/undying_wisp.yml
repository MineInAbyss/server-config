bone_ball:
  Cooldown: 1
  Conditions:
  Skills:
    - sound{s=item.crossbow.quick_charge_1;p=0.5;v=0.6} @Self
    - delay 5
    - sound{s=item.crossbow.quick_charge_1;p=0.4;v=0.8} @Self
    - delay 5
    - sound{s=item.crossbow.quick_charge_1;p=0.4;v=1} @Self
    #- delay 5
    #- sound{s=item.crossbow.quick_charge_1;p=0.3;v=0.6} @Self
    - delay 20
    - command{c="execute at <caster.uuid> run xp add <caster.name> -20";op=true}
    - projectile{onTick=BB_tick;onHit=bone_impact;v=20;i=1;hR=1;vR=1;hnp=true;syo=1.5;hp=true} @targetlocation

bone_impact:
  Skills:
    - shieldbreak{duration=150} 
    - delay 1
    #- blackscreen{d=40} @EntitiesNearOrigin{r=2}
    #- spin{duration=60;velocity=0} @EntitiesNearOrigin{r=2} #functions like a stun
    - stun{duration=60;f=true} @EntitiesNearOrigin{r=2}
    - potion{t=BLINDNESS;d=80;l=1} @EntitiesNearOrigin{r=2}
    - damage{a=6;ia=true} @PlayersNearOrigin{r=2}
    - damage{a=10;ignorearmor=false} @EntitiesNearOrigin{r=2;ignore=players}

BB_tick:
  Skills:
    - sound{s=block.sculk_shrieker.break;p=1;v=0.5} @origin
    - sound{s=entity.pufferfish.death;p=0.2;v=0.4} @origin
    - effect:particlebox{p=bubble;a=5;s=0.1;r=0.5}
    - effect:particlebox{p=bubble_pop;a=9;s=0.1;r=0.2}
