# These particles aid with users that can't hear or have sound turned off,
# They are ordered same as the ghost seek chimes, with 1 being the lowest signal, to 5 being the highest.
# They follow colors from red, orange, yellow, green, teal,
# with increasing saturation at each step.
ghost_seek_effect_1:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek_1;sc=master;volume=1.5} @self
    - effect:particles{particle=redstone;color=#000435;amount=6;hS=0.5;vS=0.5;y=1} @self
ghost_seek_effect_2:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek_2;sc=master;volume=1.5} @self
    - effect:particles{particle=redstone;color=#5B62A5;amount=8;hS=0.5;vS=0.5;y=1} @self
ghost_seek_effect_3:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek_3;sc=master;volume=1.5} @self
    - effect:particles{particle=redstone;color=#F3CB2D;amount=10;hS=0.5;vS=0.5;y=1} @self
ghost_seek_effect_4:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek_4;sc=master;volume=1.5} @self
    - effect:particles{particle=redstone;color=#65C756;amount=15;hS=0.5;vS=0.5;y=1} @self
ghost_seek_effect_5:
  Skills:
    - sound{s=mineinabyss:item.ghost_seek_5;sc=master;volume=1.5} @self
    - effect:particles{particle=redstone;color=#17D8C5;amount=20;hS=0.5;vS=0.5;y=1} @self

# This effect is meant for the enhanced ghost seek,
# which makes nearby skeletons glow.
ghost_seek_glow_nearby:
  Skills:
    - potion{type=GLOWING;duration=40;level=1} @MobsInRadius{types=prayingSkeleton_l1,prayingSkeleton_l2,prayingSkeleton_l3,prayingSkeleton_l4,prayingSkeleton_l5;amount=1to99;radius=25}
