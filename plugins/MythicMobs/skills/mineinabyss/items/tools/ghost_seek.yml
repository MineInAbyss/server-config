    - sound{s=mineinabyss:item.ghost_seek_3;sc=ui;volume=1.3} @self
    - actionmessage{m="<#F3CB2D>du du dum tick";d=120} @self
    - effect:particles{particle=redstone;color=#F3CB2D;amount=10;hS=0.5;vS=0.5;y=1.5} @forward{f=1.5}
ghost_seek_effect_4:
