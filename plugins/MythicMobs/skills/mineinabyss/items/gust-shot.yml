windstaff:
  Cooldown: 1
  Skills:
    - command{c="execute at <caster.uuid> run xp add <caster.name> -40";op=true}

    - potion{type=SLOW;duration=35;level=2;p=false;force=true} @Self
    - effect:particles{particle=dust_plume;amount=9;y=0.5;size=2}
    - sound{s=block.roots.break;sc=players;p=0.5;v=0.7;repeat=4;repeatInterval=3} @self
    - delay 20
    - sound{s=entity.blaze.shoot;sc=players;p=1.1;v=0.7} @self
    - sound{s=entity.ender_dragon.flap;sc=players;p=0.6;v=0.7} @self
    - sound{s=entity.ghast.shoot;sc=players;p=<random.float.0.8to1.0>;v=0.8} @self
    - sound{s=block.metal.break;sc=players;p=1.3;v=0.6} @self

    - projectile{onTick=windstaff_tick;onHit=wind_impact;onEnd=wind_impact;v=10;i=1;hR=1;vR=1;hnp=true;tyo=0.5;syo=1.5} @targetlocation
    - delay 20 

windstaff_tick:
  Skills:
    - effect:particles{particle=dust_plume;amount=9;hS=.1;vS=.1;speed=0.01}



wind_impact:
  Skills:
    - effect:particles{p=gust_emitter_large;a=1;vs=0.2;hs=0.2;s=0;y=1;size=1.5}
    - fakeexplosion
    - throw{velocity=14;velocityY=7} @EntitiesNearOrigin{r=4}
    - damage{a=20} @EntitiesNearOrigin{r=4}
    - shieldbreak{duration=150}