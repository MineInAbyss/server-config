charred_skeleton_curse:
  Cooldown: 1
  Conditions:
  Skills:
    - randomskill{skills=curse_kuongatari_1, curse_kuongatari_2, curse_kuongatari_3, curse_chikyuoebi, curse_areaofeffect_harm, curse_areaofeffect_poison, curse_slow_1, curse_slow_2, curse_blindness_1, curse_blindness_2, curse_levitation_1, curse_levitation_2, curse_hunger_1, curse_hunger_2, curse_bloodyscreen_1, curse_bloodyscreen_2, curse_throw_1, curse_throw_2}
    - smokeswirl{duration=120;interval=10} @self
    - sound{s=minecraft:ambient.cave;p=1;v=0.8} @PIR{r=5}

golden_skeleton_death:
  Cooldown: 1
  Conditions:
  Skills:
    - fakelightning{l=true} @self
    - delay 10
    - sound{s=entity.lightning_bolt.thunder;p=1;v=0.6} @PIR{r=5}
    - sound{s=entity.lightning_bolt.thunder;p=0.2;v=0.4} @PIR{r=5}
    - effect:particlebox{particle=ominous_spawning;amount=20;hS=3;vS=1.5;speed=0;y=1;size=2;r=3} @self

curse_kuongatari_1:
