    - effect:sound{s=entity.polar_bear.warning;v=0.8;p=1.9} @self
    - effect:sound{s=entity.polar_bear.warning;v=0.8;p=1.8} @self
    - effect:sound{s=entity.polar_bear.warning;v=0.8;p=1.7} @self
    - delay 1
    - potion{t=WEAKNESS;d=200;l=1} @PIR{r=30}
    - effect:sound{s=entity.ender_dragon.growl;v=0.8;p=2} @self
    - effect:sound{s=entity.ender_dragon.growl;v=0.8;p=1.9} @self
    - effect:sound{s=entity.ender_dragon.growl;v=0.8;p=1.8} @self
    - effect:sound{s=entity.ender_dragon.growl;v=0.8;p=1.7} @self
    - particlering{p=dustColorTransition;color1=#49DEEA;color2=#A559F7;size=2;a=10;r=8;points=16;hs=1;vs=1;repeat=1;repeatInterval=5} @self
    - delay 41
    - state{s=roar;remove=true} @self
    - setAI{ai=true} @self
