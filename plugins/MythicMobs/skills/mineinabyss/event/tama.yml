###### tama shout

tama_shout:
  Conditions:
    - offgcd true
    - stance{s=spikeless;str=true} false
  Cooldown: 25
  Skills:
    - gcd{ticks=300} @self
    - setAI{ai=false} @self
    - state{s=roar;li=0;lo=0} @self
