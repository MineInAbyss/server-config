    - delay 15
    - totem{ch=3;onStart=tachiATTACKDamage;hnp=true;hp=true;hR=3;vR=4;i=1} @forward{f=4}
    - sound{s=entity.iron_golem.attack;sc=hostile;p=<random.float.0.5to0.1>;v=1.1} @self
