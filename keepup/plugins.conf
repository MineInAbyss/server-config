# Usage info: https://wiki.mineinabyss.com/contributing/setup/server-setup/#auto-download-plugins
#
# Prefer URLs in this order:
# - GitHub
# - Modrinth
# - Selfhosted on MineInAbyss
# - Avoid any other source
#
# Notes:
# - Don't use public links for premium plugins, use the rclone format instead
paper {
  # Plugins we often depend upon
  core {
    fawe: "https://repo.mineinabyss.com/plugins/fawe/FastAsyncWorldEdit-Paper-2.15.5-SNAPSHOT-439559d.jar" // feat/26.3 branch build, switch back to github releases once 2.15.5 ships
    worldguard: "https://repo.mineinabyss.com/plugins/worldguard/worldguard-bukkit-7.0.16-beta-01.jar" // https://dev.bukkit.org/projects/worldguard/files
    worldguard-extra-flags: "https://repo.mineinabyss.com/plugins/worldguardextraflags/worldguard-extraflagsplus-4.4.5.jar" // https://github.com/tinsware/WorldGuardExtraFlagsPlus, aromaa has had no release since 2024 and this fork keeps all 25 original flag names

    idofront-platform: "github:MineInAbyss/Idofront:v2.0.2-dev.2:.*jar" // https://github.com/MineInAbyss/Idofront/releases

    luckperms: "https://repo.mineinabyss.com/plugins/luckperms-bukkit/LuckPerms-Bukkit-5.5.22.jar" // https://luckperms.net/
    placeholderapi: "https://repo.mineinabyss.com/plugins/placeholderapi/PlaceholderAPI-2.11.7.jar" // https://www.spigotmc.org/resources/placeholderapi.6245/updates
    vault: "https://repo.mineinabyss.com/plugins/vault/Vault-1.7.3.jar"

    #protocollib: "https://repo.mineinabyss.com/plugins/protocollib/ProtocolLib-5.4.0-747.jar"
    deeperworld: "github:MineInAbyss/DeeperWorld:v0.14.0-dev.4:.*jar" // https://github.com/MineInAbyss/DeeperWorld/releases

    guiy: "github:MineInAbyss/guiy-compose:v0.15.1:.*releases/.*guiy-compose.*jar" // https://github.com/MineInAbyss/guiy-compose/releases
    geary {
      geary: "github:MineInAbyss/geary-papermc:v0.35.0-dev.2:.*jar" // https://github.com/MineInAbyss/geary-papermc/releases
      nexo: "mineinabyss:/private/plugins/nexo/nexo-1.29-7c13b849-MiA.jar" // built by the mineinabyss branchs publish workflow, which also uploads nexo-MiA-latest.jar
    }
    packy: "github:MineInAbyss/Packy:v0.9.2-dev.6:.*jar"
    mineinabyss: "github:MineInAbyss/MineInAbyss:v0.19.5-dev.1:.*jar" // https://github.com/MineInAbyss/MineInAbyss/releases

    myworlds: "https://repo.mineinabyss.com/plugins/myworlds/MyWorlds-2.0.1-SNAPSHOT-369.jar"
    simplevoicechat: "https://repo.mineinabyss.com/plugins/simplevoicechat/voicechat-bukkit-2.6.23.jar"
    discordsrv: "github:DiscordSRV/DiscordSRV:v1.30.4:.*.jar"
    bkcommonlib: "https://repo.mineinabyss.com/plugins/bkcommonlib/BKCommonLib-2.0.4-SNAPSHOT-26.3-MiA.jar" // local 26.3 port, upstream has no 26.3 build yet
  }

  shared-features {
    staminaclimb: "github:MineInAbyss/StaminaClimb:v0.25.1-dev.3:.*jar"
  }

  survival-features {
    bonfire: "github:MineInAbyss/Bonfire:v1.12.7-dev.1:.*jar"
    blocklocker: "https://repo.mineinabyss.com/plugins/blocklocker/blocklocker-1.15.jar"
    mythichud: "mineinabyss:/private/plugins/mythichud/MythicHUD-1.3.5-SNAPSHOT.jar"
    okiboline {
      traincarts: "https://repo.mineinabyss.com/plugins/traincarts/TrainCarts-2.0.1-1745.jar"
      tccoasters: "https://repo.mineinabyss.com/plugins/tccoasters/TCCoasters-2.0.1-SNAPSHOT-410.jar"
    }
    hibiscuscommons: "mineinabyss:/private/plugins/hibiscuscommons/HibiscusCommons-0.9.3-geary034.jar"
    hmccosmetics: "mineinabyss:/private/plugins/hmccosmetics/HMCCosmeticsRemapped-2.9.2.jar"
    hmccolor: "mineinabyss:/private/plugins/hmccolor/HMCColor-2.7.jar"
    orey: "github:MineInAbyss/Orey:v1.0.0:.*jar"
    shopkeepers: "https://repo.mineinabyss.com/plugins/shopkeepers/Shopkeepers-2.28.0-SNAPSHOT.jar"
    shulkerpacks: "https://repo.mineinabyss.com/plugins/shulkerpacks/ShulkerPacks-1.7.3.jar"
    packetevents: "https://repo.mineinabyss.com/plugins/packetevents/packetevents-spigot-2.14.0-SNAPSHOT.jar"
    luxdialogues: "mineinabyss:/private/plugins/luxdialogues/LuxDialogues-4.1.3.jar"
  }

  chat {
    chatty: "github:MineInAbyss/Chatty:v0.10.0-dev.1:.*paper.*jar"
    emojy: "github:MineInAbyss/Emojy:v0.10.27-dev.1:.*jar"
    signedvelocity: "github:4drian3d/SignedVelocity:1.4.1:SignedVelocity-Paper-1.4.1.jar"
  }

  mobs {
    modelengine: "mineinabyss:/private/plugins/modelengine/ModelEngine-R4.1.1-2440.jar"
    mythicmobs: "mineinabyss:/private/plugins/mythicmobs/MythicMobsPremium-5.13.1-SNAPSHOT-6145.jar"
  }

  utility {
    changeslots: "https://repo.mineinabyss.com/plugins/changeslots/ChangeSlots-2.4.0.jar"
    extracommands: "github:MineInAbyss/ExtraCommands:v0.14.1-dev.0:.*jar"
    extracontexts: "https://repo.mineinabyss.com/plugins/extracontexts/ExtraContexts.jar"
    dev-tools {
    }
    huskhomes: "https://repo.mineinabyss.com/plugins/huskhomes/HuskHomes-Paper-4.11-7a2d09a.jar"
    doorcloser: "https://repo.mineinabyss.com/plugins/doorcloser/DoorCloser-1.0.12.jar"
    openinv: "https://repo.mineinabyss.com/plugins/openinv/OpenInv-5.3.4-SNAPSHOT-b67ca90.jar" // CI build of the draft 26.3 PR https://github.com/Jikoo/OpenInv/pull/430, switch back to a release once it merges
    axiom: "https://repo.mineinabyss.com/plugins/axiom/AxiomPaper-6.0.1-for-MC26.3.jar"
  }

  builder-tools {
    buildersutilities: "https://repo.mineinabyss.com/plugins/buildersutilities/Builders-Utilities-2.1.1-151.jar"
    #favs: "https://repo.mineinabyss.com/plugins/favs/fastasyncvoxelsniper-3.1.1-SNAPSHOT.jar"
    goBrush: "https://repo.mineinabyss.com/plugins/gobrush/goBrush-3.8.0-103.jar"
    goPaint: "https://repo.mineinabyss.com/plugins/gopaint/goPaintAdvanced-1.7.0-all.jar"
    arceon: "mineinabyss:/private/plugins/arceon/Arceon-0.5.5.jar"
  }

  performance {
    #viewdistancetweaks: "https://repo.mineinabyss.com/plugins/viewdistancetweaks/ViewDistanceTweaks-1.5.8-SNAPSHOT.jar"
  }

  velocity-bridge {
    #disablejoinmessage: "https://repo.mineinabyss.com/plugins/disablejoinmessage/DisableJoinMessage-1.0.jar"
    papi-proxy-bridge: "https://repo.mineinabyss.com/plugins/papiproxybridge/PAPIProxyBridge-Bukkit-1.8.4-c4d2079.jar"
  }
}

velocity {
  banannouncer: "https://repo.mineinabyss.com/plugins/banannouncer/BanAnnouncer_3.0.1.jar"
  chatty-velocity: "github:MineInAbyss/Chatty:v0.10.0-dev.1:.*velocity.*jar"
  signedvelocity: "github:4drian3d/SignedVelocity:1.4.1:SignedVelocity-Proxy-1.4.1.jar"
  libertybans: "https://repo.mineinabyss.com/plugins/libertybans/LibertyBans_1.2.0-M1-SNAPSHOT.jar" // master build, no tagged release supports Velocity 4 yet and the db is on schema v42
  luckperms-velocity: "https://repo.mineinabyss.com/plugins/luckperms-velocity/LuckPerms-Velocity-5.5.22.jar"
  maintenance-velocity: "github:kennytv/Maintenance:4.3.0:.*Maintenance-Velocity-.*.jar"
  minimotd-velocity: "https://repo.mineinabyss.com/plugins/minimotd-velocity/minimotd-velocity-2.2.2.jar"
  papi-proxy-bridge: "https://repo.mineinabyss.com/plugins/papiproxybridge/PAPIProxyBridge-Velocity-1.8.4-1959e64.jar"
  rocketjoin-velocity: "github:Lorenzo0111/RocketJoin:2.5:RocketJoin-velocity-.*.jar"
//  spark-velocity: "https://repo.mineinabyss.com/plugins/spark/spark-1.10.127-velocity.jar"
  spicord: "https://repo.mineinabyss.com/plugins/spicord/Spicord_5.8.1.jar"
  velocitab: "https://repo.mineinabyss.com/plugins/velocitab/Velocitab-1.7.11-b34b3ec.jar"
  unifiedMetrics: "github:Cubxity/UnifiedMetrics:v0.3.8:.*unifiedmetrics-platform-velocity-.*jar"
  simplevoicechat: "https://repo.mineinabyss.com/plugins/simplevoicechat/voicechat-velocity-2.6.18.jar"
  vivecraft: "https://github.com/JLyne/VivecraftVelocityExtensions/releases/download/v1.1/VivecraftVelocityExtensions-1.1.jar"
}

mineinabyss {
  # Plugins all production servers should have
  production-basic: ${paper.core} ${paper.utility} ${paper.chat} ${paper.velocity-bridge} ${paper.performance} {
    unifiedMetrics: "github:Cubxity/UnifiedMetrics:v0.3.8:.*unifiedmetrics-platform-bukkit-.*jar$"
  }

  production: ${mineinabyss.production-basic} {
    coreprotect: "https://repo.mineinabyss.com/plugins/coreprotect/CoreProtect-24.0.jar"
  }

  debugging-tools {
    #pyroscope: "github:MineInAbyss/pyroscope-mc:v1.0.2:.*jar"
  }

  servers {
    velocity: ${velocity} {
    }

    build: ${mineinabyss.production} ${paper.builder-tools} ${paper.shared-features} {
    }

    survival: ${mineinabyss.production} ${paper.survival-features} ${paper.mobs} ${paper.shared-features} {
    }

    dev: ${mineinabyss.servers.survival} ${mineinabyss.debugging-tools} {
      mythicdungeons: "mineinabyss:/private/plugins/mythicdungeons/MythicDungeons-2.1.0-SNAPSHOT-479.jar"
    }

    staging: ${mineinabyss.servers.survival} ${mineinabyss.debugging-tools} {
    }

    dev-alpha: ${paper.utility.dev-tools} ${paper.mobs} ${paper.core} {
      extracommands: ${paper.utility.extracommands}
    }

    # Used for local development, where as few plugins as possible are auto downloaded
    dev-basic: ${paper.utility.dev-tools} ${paper.mobs} ${paper.core} {
      extracommands: ${paper.utility.extracommands}
      chatty: ${paper.chat.chatty}
    }

    archive: ${mineinabyss.production-basic}  {
    }

    empty: {

    }
  }
}
