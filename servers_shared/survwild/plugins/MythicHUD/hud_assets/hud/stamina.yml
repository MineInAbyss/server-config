stamina:
  conditions:
    - placeholder{ph=%mineinabyss_hud_vanilla%} false hide
    - placeholder{ph=%hmccosmetics_wardrobe-enabled%} false hide
    - gamemode{gm=survival,adventure} true hide
    - progress{l=fill;o=<;v=100%} true hide
  layers:
    alert:
      texture:
        path: stamina/stamina_bar_alert.png
      color: "#FFFFFF"
      offset:
        x: 19
        y: -3
      function:
        listener: staminaclimb:stamina_alert
        increment: 154
        orientation: horizontal
    fill:
      texture:
        path: stamina/stamina_bar.png
      color: "#FFFFFF"
      offset:
        x: 19
        y: -3
      function:
        listener: staminaclimb:stamina
        increment: 154
        orientation: horizontal
    icon:
      texture:
        path: stamina/stamina_frame.png
