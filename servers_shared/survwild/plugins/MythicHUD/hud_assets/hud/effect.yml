effect-bleeding:
  conditions:
    - gamemode{gm=survival,adventure;v=false} true hide
    - effect{e=wither;v=false} true hide
    - placeholder{ph=%hmccosmetics_wardrobe-enabled%} false hide
  layers:
    fill:
      texture:
        path: effects/bleeding_bar.png
      color: "#FFFFFF"
      offset:
        x: 17
        y: -3
      function:
        listener: health
        increment: 20
        orientation: horizontal
    icon:
      texture:
        path: effects/bleeding_icon.png
