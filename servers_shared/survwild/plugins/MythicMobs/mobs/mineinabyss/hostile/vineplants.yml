wanabushi:
  Type: VINDICATOR
  Modules:
    ThreatTable: true
  Display: "<green>Wanabushi"
  Faction: ally
  AIGoalSelectors:
  - LookAtTarget{h=true}
  - randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 monsters
  - 2 nearestConditionalTarget{conditions=[
        - entitytype PLAYER false
      ]} 
  Health: 60 # change this
  Damage: 0 # keep this 0
  Options:
    PreventSunburn: true
    AlwaysShowName: false
    Silent: false
    MovementSpeed: 0.35
    MaxCombatDistance: 25
    PreventOtherDrops: true
    PreventBlockInfection: true
    FollowRange: 25
  Model:
    Id: wanabushi
    ViewRadius: 48
    Drive: false
    DamageTint: true
    Scale: 1
  Skills:
    ####### Misc
    - skill{s=displayHealth} ~onDamaged
    - skill{s=allyvineblasterattack} @Self ~onTimer:10
    # - skill{s=vineblastermortar} @target ~onTimer:20
    - cancelevent{sync=true} @Self ~onAttack
    - remove{delay=500} @self ~onSpawn

