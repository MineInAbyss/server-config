pebble_throw:
  Cooldown: 1
  Skills:
    - playanimation{a=0;audience=World} @self
    - projectile{bulletType=ITEM;material=pebble;onHit=pebbleimpact;v=12;g=0.65;i=1;hR=0.5;vR=0.5;hnp=true;hp=true;syo=1.5;vO=0.1;bmd=true} @forward{f=1000}

pebbleimpact:
  Skills:
    - effect:particles{particle=Electric_Spark;amount=10;hS=1;vS=1;y=.5}
    - damage{a=3}
    - sound{s=entity.snow_golem.hurt;sc=hostile;p=1;v=0.6}
    - aura{auraName=pebblehit;duration=20;cotd=false;i=5;cod=true} @ENO{r=2} #for mobs to check what they have been hit by