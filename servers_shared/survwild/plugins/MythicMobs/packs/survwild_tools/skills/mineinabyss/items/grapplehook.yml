####################################################################
##################### Right Click Ability ##########################
####################################################################

grapplehook_shoot:
  Skills:
  - projectile{bulletType=MOB;mm=grapple_hook_hook;onTick=GrappleHook_TICK;onHit=GrappleHook_HIT;onHitBlockSkill=GrappleHook_END;v=25;i=1;hR=1;vR=1;g=0.5;doEndSkillOnHit=false;hnp=true;dd=20} @forward{f=1000}

GrappleHook_END:
  Conditions:
    - hasaurastacks{n=gapplehookcharge} true
  Skills:
  - lunge{v=2;vy=1} @origin
  - delay 5
  - propel{v=1} @origin
  - potion{type=JUMP_BOOST;duration=18;l=1} @self

GrappleHook_HIT:
  Conditions:
    - hasaurastacks{n=gapplehookcharge} true
  TargetConditions:
    - mythicmobtype{type=prayingSkeleton_base,prayingSkeleton_l1,prayingSkeleton_l2,prayingSkeleton_l3,prayingSkeleton_l4,prayingSkeleton_l5,goldenSkeleton,charredSkeleton,stingerhead,orbpiercer,tachikatana,virinsipede,splitjaw} false
  Skills:
  - sound{s=block.chain.hit;sc=ui;volume=1} @self
  - sound{s=block.chain.break;sc=ui;volume=0.55;repeat=10;repeati=1} @self
  - pull{v=10} @targetedtarget{ignore=player} 
  # - stun{duration=20} @targetedtarget{ignore=animal,creature,monster} # Maybe
GrappleHook_TICK:
  Conditions:
    - hasaurastacks{n=gapplehookcharge} true
  Skills:
  - sound{s=block.chain.break;sc=ui;volume=0.25} @self
  - sound{s=block.chain.break;sc=ui;volume=0.5} @origin
  - effect:particle{p=ash}
# Ideas:
# consume stamina
# wind back up
# grapple air

####################################################################
######################### Passive Ability ##########################
####################################################################

grapplehook_charge: # Shim for geary
  Skills:
  - skill{s=grapplehook_charge_}
grapplehook_charge_:
  Cooldown:
  Conditions:
  Skills:
  - aura{auraName=gapplehookcharge;duration=3;c=1;maxStacks=1;cotd=false;rd=true} @self