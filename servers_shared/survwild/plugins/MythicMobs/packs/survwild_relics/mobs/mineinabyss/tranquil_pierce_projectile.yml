tranquil_pierce_projectile:
  Type: ARMOR_STAND
  AITargetSelectors:
  - players
  KillMessages:
  - '<target.name> was impaled by <parent.name>.'
  - '<target.name> failed to escape <parent.name>.'
  Options:
    Marker: true
    Invisible: true
    Invincible: true
    HasGravity: false
    Small: true
 
  Skills:
  - model{mid=tranquil_pierce_projectile;n=false} @self ~onSpawn
  - state{mid=idle;s=attack} @self ~onSpawn