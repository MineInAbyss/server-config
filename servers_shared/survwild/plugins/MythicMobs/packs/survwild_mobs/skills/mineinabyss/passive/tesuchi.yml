tesuchiDisguise:
  Cooldown: 10
  Conditions:
    - targetwithin{d=5}
    - moving{} true
  Skills:
    - sound{s=item.dye.use;p=0.5;v=0.82;sc=neutral} @self
    - sound{s=block.candle.extinguish;p=0.5;v=0.82;sc=neutral} @self
    - sound{s=entity.frog.ambient;p=1.9;v=0.82;sc=neutral} @self
    - effect:particles{particle=falling_spore_blossom;a=30;hs=0.9;vs=0.04;y=0.2;repeat=2;repeatInterval=1} @self
    - partvisibility{m=tesuchi;v=false;p=torso} @self
    - partvisibility{m=tesuchi;v=false;p=head} @self
    - partvisibility{m=tesuchi;v=false;p=backtorso} @self
    - partvisibility{m=tesuchi;v=false;p=frontarml} @self
    - partvisibility{m=tesuchi;v=false;p=frontarmr} @self
    - partvisibility{m=tesuchi;v=false;p=reararml} @self
    - partvisibility{m=tesuchi;v=false;p=reararmr} @self
    - setstance{s=hiding} @self
    - delay <random.160to200>
    - partvisibility{m=tesuchi;v=true;p=torso} @self
    - partvisibility{m=tesuchi;v=true;p=head} @self
    - partvisibility{m=tesuchi;v=true;p=backtorso} @self
    - partvisibility{m=tesuchi;v=true;p=frontarml} @self
    - partvisibility{m=tesuchi;v=true;p=frontarmr} @self
    - partvisibility{m=tesuchi;v=true;p=reararml} @self
    - partvisibility{m=tesuchi;v=true;p=reararmr} @self
    - sound{s=entity.frog.ambient;p=1.9;v=0.82;sc=neutral;sync=true} @self
    - setstance{s=clear} @self

tesuchiInvis:
  Cooldown: 0.0
  Conditions:
    - stance{s=hiding} true
  Skills:
    - potion{t=INVISIBILITY;l=0;force=true;p=false;d=10} @self
    - potion{t=SPEED;l=4;force=true;p=false;d=15} @self


tesuchiStep:
  Cooldown: 0
  Conditions:
    - onground{} true
  Skills:
    - sound{s=entity.frog.tongue;sc=neutral;p=<random.float.1.9to2.0>;v=0.8} @self
    - sound{s=entity.frog.eat;sc=neutral;p=<random.float.1.9to2.0>;v=0.8} @self

