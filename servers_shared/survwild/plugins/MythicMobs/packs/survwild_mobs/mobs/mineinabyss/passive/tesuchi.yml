tesuchi:
  Type: OCELOT
  SpawnCategory: passive
  Display: <dark_green>Tesuchi
  Modules:
    ThreatTable: true
  AIGoalSelectors:
    - clear
    - fleeplayers
    - randomlookaround
    - float
  AITargetSelectors:
    - clear
  Faction: tesuchis
  Health: 20 # change this
  Damage: 0 # keep this 0
  Options:
    Silent: true
    PreventOtherDrops: true
    FollowRange: 25
    MovementSpeed: 0.2
    KnockbackResistance: 1.0
    Interactable: false
  Drops:
    - exp 5-10
    - geary mineinabyss:tesuchi_tail 1
    - geary mineinabyss:tesuchi_scales 1-3 0.8
    - TosubachiDrop

  Model:
    Id: tesuchi
    ViewRadius: 48
    Drive: false
    DamageTint: true
  Geary:
    mineinabyss:show_health_bar: default
  Skills:
    ####### Misc

    - look{} @target ~onTimer:20
    - defaultstate{t=walk;s=walk;sp=2.2} @self ~onSpawnOrLoad
    - CancelEvent{sync=true} @self ~onAttack
    - CancelEvent{sync=true} @self ~onInteract
    ####### Stances/AI

    ########### FX
    - skill{s=bloodEffectSmall} @self ~onHurt <100%
    - skill{s=tesuchiHurt} @self ~onHurt
    - skill{s=tesuchiDeath} @self ~onDeath
    #- summon{type=tesuchiCorpse;amount=1;radius=0;delay=16} @self ~onDeath
    - skill{s=tesuchiDisguise;delay=<random.0to20>} @self ~onTimer:20
    - skill{s=tesuchiInvis} @self ~onTimer:10
