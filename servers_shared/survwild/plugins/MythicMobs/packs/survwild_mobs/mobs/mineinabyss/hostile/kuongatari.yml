kuongatari:
  Type: CAVE_SPIDER
  SpawnCategory: hostile
  Display: "<#1FB53D>Kuongatari"
  Health: 50
  Damage: 7
  AIGoalSelectors:
    - clear
    - meleeattack
    - float
    - randomstroll
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
  Options:
    PreventSunburn: true
    KnockbackResistance: 0.2
    #DigOutOfGround: true
    Collidable: true
    #Silent: false
    FollowRange: 30
    MovementSpeed: 0.27
    MaxCombatDistance: 30
    DigOutOfGround: true
    PreventOtherDrops: true
  Model:
    Id: kuongatari
    ViewRadius: 48
    Drive: false
    DamageTint: true
    Scale: 0.5
  DamageModifiers:
    - DROWNING 0
    - FIRE 15
    - FIRE_TICK 3
  Drops:
    - exp 15-25
    - geary mineinabyss:kuongatari_juice 1 0.3
    - geary mineinabyss:kuongatari_silk 1 0.3
    - geary mineinabyss:kuongatari_abdomen_raw 1-2 0.35

  Skills:
    - skill{s=displayHealth} ~onDamaged
    - skill{s=Changetarget} ~onTimer:180 <99%
    - dismount ~onTimer:20
    - state{mid=kuongatari;s=attack} @self ~onAttack
    #add onAttack poison effect and Kuon egg effect

    - aura{auraName=kuongatariflower;duration=100000;onStart=kuongatari_flower_start;onTick=kuongatari_player_detect;c=1;maxStacks=1;cotd=false;rd=true} @self ~onTimer:10 ?!incombat
    - skill{s=kuongatari_aggro_engage} ~onTimer:10 ?hasaura{n=kuongatariaggro}

    - potion{type=SLOW_FALLING;duration=120;level=1;p=false} @self ~onTimer:100
    - shieldbreak{duration=100} @target ~onAttack 0.35
kuongatari_summon:
  Type: SPIDER
  Display: "<#1FB53D>Baby Kuongatari"
  Health: 30
  Damage: 6
  AITargetSelectors:
    - clear
    - attacker
    - players
  Options:
    PreventSunburn: true
    PreventOtherDrops: true
    KnockbackResistance: 0
    #DigOutOfGround: true
    Collidable: true
    # Silent: true
    FollowRange: 30
    MovementSpeed: 0.35
    MaxCombatDistance: 30
  Equipment:
    - TORCH HAND
  Drops:
    - exp 5-15
    - geary mineinabyss:kuongatari_juice 1 0.04
    - geary mineinabyss:kuongatari_silk 1 0.1
    - geary mineinabyss:kuongatari_abdomen_raw 1 0.3
  Model:
    Id: kuongatari
    ViewRadius: 48
    Drive: false
    DamageTint: true
    Scale: 0.42
  DamageModifiers:
    - DROWNING 0
    - FIRE 15
    - FIRE_TICK 3
  Skills:
    - skill{s=displayHealth} ~onDamaged
    - skill{s=Changetarget} ~onTimer:180 <99%
    - dismount ~onTimer:20
    - state{mid=kuongatari;s=attack} @self ~onAttack
    #add onAttack poison effect and Kuon egg effect

    - aura{auraName=kuongatariflower;duration=100000;onStart=kuongatari_flower_start;onTick=kuongatari_player_detect;c=1;maxStacks=1;cotd=false;rd=true} @self ~onTimer:10 ?blocktype{type=white_tulip} ?!incombat
    - skill{s=kuongatari_aggro_engage} ~onTimer:10

    - potion{type=SLOW_FALLING;duration=120;level=1;p=false} @self ~onTimer:100
    - shieldbreak{duration=100} @target ~onAttack 0.35