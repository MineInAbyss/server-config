okibo:
  Type: PIG
  SpawnCategory: passive
  Display: "<#10DEA7>Okibo"
  Health: 40
  Damage: 0
  AIGoalSelectors:
    - clear
    - randomstroll
    - lookatplayers
    - randomlookaround
    - float
  AITargetSelectors:
    - clear
  Options:
    Collidable: true
    Silent: true
    Interactable: true
    MovementSpeed: 0.2
    KnockbackResistance: 0.2
    PreventOtherDrops: true
  Model:
    Id: okibo
    ViewRadius: 48
    DamageTint: true
    Scale: 2.75
  Drops:
    - exp 20-25
    - geary mineinabyss:okibo_meat_raw 1-2 0.6
    - geary mineinabyss:okibo_fur 1-2 0.7

  Skills:
    - skill{s=displayHealth} ~onDamaged
    - skill{s=milk_mob} ~onInteract ?~holding{m=bucket}
    #- sound{s=entity.goat.milk;p=0.5} @self ~onInteract ?~holding{m=bucket} # if you want sounds to be mob specific remove them from the milk skill and move them into mob skills
    - skill{s=shear_okibo} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - skill{s=shear_mob} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - onDeath{onDeathSkill=okibo_death_drop} @self ?!hasaura{auraName=unshearable}