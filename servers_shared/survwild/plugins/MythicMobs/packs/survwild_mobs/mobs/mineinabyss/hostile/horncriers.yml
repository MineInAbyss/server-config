woodcrier:
  Type: ZOMBIE
  SpawnCategory: hostile
  Display: "<#9A1CAD>Woodcrier"
  Health: 30
  Damage: 0
  AIGoalSelectors:
    - clear
    - meleeattack
    - float
    - randomstroll
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
  Options:
    KnockbackResistance: 0.1
    Collidable: true
    DigOutOfGround: true
    FollowRange: 32
    MaxCombatDistance: 128
    LockPitch: true
    Silent: true
    Interactable: true
    MovementSpeed: 0.3
    PreventSunburn: true
    PreventOtherDrops: true
    PreventJockeyMounts: true
  Model:
    Id: woodcrier
    ViewRadius: 48
    Drive: false
    DamageTint: true
  DamageModifiers:
    - PROJECTILE 0.5
  Modules:
    ThreatTable: true
  Drops:
    - exp 10-30
    - geary mineinabyss:woodcrier_horn 1-2 0.6
  Skills:
    # - CancelEvent{sync=true} ~onAttack
    - DefaultState{m=horncrier_easy;t=walk;s=not_in_combat} @self ~onSpawnOrLoad
    - DefaultState{m=horncrier_easy;t=walk;s=walk} @self ~onEnterCombat
    - DefaultState{m=horncrier_easy;t=walk;s=not_in_combat} @self ~onDropCombat
    - skill{s=Changetarget} ~onTimer:160 <99%

    # - skill{s=hc_dash} @target ~onTimer:20
    - skill{s=hc_Attack} @self ~onAttack

    # - skill{s=hc_backup} @self ~ondamaged
    - skill{s=hcAmbient;delay=<random.0to10>} @self ~onTimer:95 0.33
    - skill{s=hcHurt} @self ~onHurt
    #    - skill{s=hcDeath} @self ~onDeath

    - skill{s=displayHealth} ~onDamaged
    - skill{s=shear_woodcrier} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - skill{s=woodcrier_shear_revert} ~onTimer:40 ?!hasaura{auraName=unshearable} #ideally swap to a onEnd aura skill
    - skill{s=shear_mob} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - onDeath{onDeathSkill=woodcrier_death_drop} @self ?!hasaura{auraName=unshearable}













horncrier:
  Type: ZOMBIE
  Display: "<#9A1CAD>Horncrier"
