ashimite:
  Type: SHEEP #change this :tuh:
  SpawnCategory: passive
  Health: 35
  Display: "<#2597D9>Ashimite"
  AIGoalSelectors:
    - clear
    - fleeplayers{distance=5;speed=1.5;safespeed=1.5;conditions=[ - inlineofsight true ]}
    - panicWhenOnFire
    - randomstroll
    - lookatplayers
    - randomlookaround
  AITargetSelectors:
    - clear
    - players
  Options:
    KnockbackResistance: 0.0
    Collidable: true
    Color: LIGHT_BLUE
    Silent: true
    FollowRange: 48
    Interactable: true
    PreventOtherDrops: true
    MovementSpeed: 0.45
  Drops:
    - exp 5-10
    - geary mineinabyss:ashimite_meat_raw 1-2 0.6
    - geary mineinabyss:ashimite_hoof 1-2 0.3
    - geary mineinabyss:ashimite_antlers 1 0.3
  Model:
    Id: ashimite
    ViewRadius: 48
    #Drive: true
    DamageTint: true
  DamageModifiers:
    - PROJECTILE 5.0
    - SUFFOCATION 0.05
  Skills:
    - skill{s=displayHealth} ~onDamaged

    #- bodyclamp{m=orbpiercer;c=15} @self ~onSpawnOrLoad
    #- setspeed{type=walking;speed=2.0} @self ~onSpawnOrLoad
    - skill{s=deerAmbient;delay=<random.0to10>} @self ~onTimer:95 0.33
    - skill{s=deerHurt} @self ~onHurt
    - skill{s=deerDeath} @self ~onDeath
    - skill{s=milk_mob} ~onInteract ?~holding{m=bucket}
    #- sound{s=entity.goat.milk;p=0.5} @self ~onInteract ?~holding{m=bucket} # if you want sounds to be mob specific remove them from the milk skill and move them into mob skills
    - skill{s=shear_ashimite} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - skill{s=shear_mob} ~onInteract ?~holding{m=shears} ?!hasaura{auraName=unshearable}
    - onDeath{onDeathSkill=ashimite_death_drop} @self ?!hasaura{auraName=unshearable}
