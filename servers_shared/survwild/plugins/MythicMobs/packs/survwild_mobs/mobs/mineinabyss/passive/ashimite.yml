    - clear
    - players
  Options:
    KnockbackResistance: 0.0
    Collidable: true
    Color: LIGHT_BLUE
    Silent: true
    FollowRange: 48
    Interactable: true
    PreventOtherDrops: true
    #MovementSpeed: 0.25"
  Drops:
    - exp 1-10
    - geary mineinabyss:ashimite_antlers 2 1.0
    - geary mineinabyss:ashimite_meat_raw 1-2 0.3
    - geary mineinabyss:ashimite_hoof 1 0.1
