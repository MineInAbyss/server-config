set.item:
  type: minecraft:paper
  itemName: <white>Charcoal Sand Ore
  itemModel: mineinabyss:blocks/block/charcoal_sand_ore
set.block:
  blockType: NOTEBLOCK
  blockId: 1

resourcepack:
  parentModel: block/cube_all
  model: mineinabyss:blocks/block/charcoal_sand_ore
  textures:
    variables:
      all: mineinabyss:blocks/block/charcoal_sand_ore

nexo:custom_block:
  type: NOTEBLOCK
  custom_variation: 1
  model: mineinabyss:blocks/block/charcoal_sand_ore
  hardness: 0.5
  block_sounds:
    place_sound: minecraft:block.stone.place
    break_sound: minecraft:block.stone.break
    step_sound: minecraft:block.stone.step
    hit_sound: minecraft:block.stone.hit
    fall_sound: minecraft:block.stone.fall
  drop:
    # Nexo only gates a drop on the held tool once minimal_type is set, so the lowest
    # tier stands in for blocky's onlyDropWithCorrectTool
    minimal_type: WOODEN
    best_tool: PICKAXE
    silktouch: true
    loots:
      # Nexo resolves loot by nexo-id, so this only drops once charcoal_sand_raw is registered with Nexo
      - nexo_item: mineinabyss_charcoal_sand_raw
        min_amount: 1
        max_amount: 3
