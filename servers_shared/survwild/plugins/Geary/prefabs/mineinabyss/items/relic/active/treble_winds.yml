set.item:
  itemName: <#f7e7ce>Treble Winds
  type: minecraft:clock
  itemModel: mineinabyss:relic/treble_winds
  lore:
  - '<emojy:layer_3> Grade III Relic'
  - <#d7c9b3>Researchers speculate that this Relic’s purpose was never to send
  - <#d7c9b3>oneself flying, but that never stopped anyone from using it that way.
  - <font:small_bottom><gray><shadow:#00000000>Active ability. Propels the user upward on
  - <font:small_bottom><gray><shadow:#00000000>right click and forward on left click.
observe:
  itemRightClick:
  - become: parent
  - itemCooldown:
      group: mineinabyss:treble_winds
      duration: 20s
  - mythicSkills:
    - treble_winds_upward
  itemLeftClick:
  - become: parent
  - itemCooldown:
      group: mineinabyss:treble_winds
      duration: 30s
  - mythicSkills:
    - treble_winds_forward
resourcepack:
  textures:
    layers:
    - mineinabyss:relic/treble_winds
creative_tab:
  category: Relics
  vanilla_tab: minecraft:tools_and_utilities
