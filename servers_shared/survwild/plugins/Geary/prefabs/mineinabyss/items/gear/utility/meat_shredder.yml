set.item:
  type: minecraft:clock
  itemName: Meat Shredder
  itemModel: mineinabyss:gear/utility/meat_shredder
  maxStackSize: 64
  lore:
  - <yellow>Used to cut meat into smaller pieces.
  - <font:small_text><gray><shadow:#00000000>Passive slot ability. Meat you pick up is cut for you.
resourcepack:
  model: mineinabyss:gear/utility/knife
  textures:
    layers:
    - mineinabyss:gear/utility/knife

observe:
  itemRightClick:
  - become: parent
  - itemCooldown:
      group: mineinabyss:knife
      duration: 7s
  - mythicSkills:
    - knifethrow
  - consumeItem:
      type: mineinabyss:knife

passiveItem: {}
transformOnPickup:
- conditions:
  - check.item:
      customModelData:
        flags: false
        strings: shred
  output:
    prefab: mineinabyss:cut_meat_raw
  actions:
  - playSound:
      sound: minecraft:entity.player.attack.sweep
      volume: 0.6
      pitch: 1.4
- conditions:
  - check.item:
      customModelData:
        flags: true
        strings: shred
  output:
    prefab: mineinabyss:cut_meat_cooked
  actions:
  - playSound:
      sound: minecraft:entity.player.attack.sweep
      volume: 0.6
      pitch: 1.2

set.recipes: 
  discoverRecipes: true
  result:
    prefab: mineinabyss:knife
    amount: 8
  recipes:
    - type: shapeless
      items:
        - type: minecraft:stick
        - type: minecraft:iron_ingot