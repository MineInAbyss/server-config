set.item:
  type: minecraft:clock
  itemName: <#0047AB>Orphanage Issued Helmet
  itemModel: mineinabyss:gear/armor/orphan_helmet
  equippable:
    slot: HEAD
    model: mineinabyss:armor_orphan
  maxStackSize: 1
  maxDamage: 50
  enchantable: 0
  enchantmentGlintOverride: false
  lore:
  - 'Erm, dis do be armor.'
itemModel:
  model:
    type: composite
    models:
      - type: condition
        property: has_component
        component: dyed_color
        onTrue:
          type: texture
          texture: mineinabyss:gear/armor/orphan_helmet_dyeable
          tints:
            - type: dye
              default: 16777215
        onFalse:
          type: texture
          texture: mineinabyss:gear/armor/orphan_helmet
      - type: select
        property: display_context
        fallback:
          type: empty
        cases:
          - when: gui
            model:
              type: texture
              texture: mineinabyss:gear/armor/rarity_marker
              tints:
                - type: constant
                  value: 16737369
