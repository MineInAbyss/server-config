set.item:
  itemName: <#FF9D26>Bonfire
  type: minecraft:paper
  itemModel: mineinabyss:gear/utility/bonfire
  maxStackSize: 16
set.recipes:
  discoverRecipes: true
  recipes:
    - type: shaped
      items:
        S:
          type: minecraft:stick
        C:
          type: minecraft:campfire
        F:
          type: minecraft:flint_and_steel
      configuration: |-
        |SSS|
        |SFS|
        |SCS|
nexo:furniture:
  hitbox:
    # "<offset> <width>,<height>", was blocky's interactionHitbox
    interaction: 0,-0.5,0 1,1.6
  limited_placing:
    floor: true
    roof: false
    wall: false
  properties:
    translation: 0,0.5,0
copyToInstances:
  persisting:
    bonfire:bonfire: { }
