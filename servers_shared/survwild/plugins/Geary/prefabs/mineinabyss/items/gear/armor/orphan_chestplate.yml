set.item:
  type: minecraft:clock
  itemName: <#0047AB>Orphanage Issued Chestplate
  itemModel: mineinabyss:gear/armor/orphan_chestplate
  equippable:
    slot: CHEST
    model: mineinabyss:armor_orphan
  maxStackSize: 1
  maxDamage: 50
  enchantable: 0
  enchantmentGlintOverride: false
  lore:
  - 'Erm, dis do be armor.'
itemModel:
  model:
    type: composite
    models:
      - type: condition
        property: has_component
        component: dyed_color
        onTrue:
          type: texture
          texture: mineinabyss:gear/armor/orphan_chestplate_dyeable
          tints:
            - type: dye
              default: 16777215
        onFalse:
          type: texture
          texture: mineinabyss:gear/armor/orphan_chestplate
      - type: select
        property: display_context
        fallback:
          type: empty
        cases:
          - when: gui
            model:
              type: texture
              texture: mineinabyss:gear/armor/rarity_marker
              tints:
                - type: constant
                  value: 16737369
creative_tab:
  category: Gear
  vanilla_tab: minecraft:combat
