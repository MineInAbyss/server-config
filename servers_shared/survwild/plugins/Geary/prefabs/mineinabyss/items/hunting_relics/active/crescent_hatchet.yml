set.item:
  type: minecraft:netherite_sword
  itemModel: mineinabyss:hunting_relics/crescent_hatchet
  itemName: <#15ABC2><b>Crescent Hatchet
  lore:
  - '<emojy:layer_3> Grade I Relic'
  - <#249C9C>This Relic easily and effectively slices through the air, and even the
  - <#249C9C>Abyss itself, using its surroundings’ mysterious nature to its advantage.
  - <font:small_bottom><gray><shadow:#00000000>Active ability. Creates charges on right click.Takes increasing amounts
  - <font:small_bottom><gray><shadow:#00000000>of charges to create a slash of varying strength on left click.
  # tool:
  #   defaultMiningSpeed: 1.0
  #   damagePerBlock: 0
  #   rules:
  #     - correctForDrops: true
  #       speed: 9
  #       blockTypes:
  #         - mineable/axe
  unbreakable: {}
observe:
  itemLeftClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentprimer;s=>=1} true
    onFail:
    - sendActionBar:
        text: <red>Not Primed
  - itemCooldown:
      group: mineinabyss:crescentslash
      duration: 10s
  - mythicSkills:
    - crescent_slash
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - hasaurastacks{n=crescentstop} false
    onFail:
    - sendActionBar:
        text: <red>In Cooldown  
  - itemCooldown:
      group: mineinabyss:crescentprimer
      duration: 1s
  - mythicSkills:
    - crescent_primer
resourcepack:
  model: mineinabyss:hunting_relics/crescent_hatchet
