set.item:
  type: minecraft:clock
  itemName: <#f7e7ce>Symbiotic Water-shrooms
  itemModel: mineinabyss:hunting_relics/symbiotic_water-shrooms
  lore:
  - '<emojy:layer_4> Grade III Relic'
  - <#d7c9b3>Doctors have failed to reach an agreement on the safety of fungi
  - <#d7c9b3>like these as medicine. Their efficacy, however, is beyond doubt.
  - <font:small_bottom><gray><shadow:#00000000>Active ability. Heals user and surroundings on right click.
observe:
  itemRightClick:
  - become: parent
  - ensure:
      mythicConditions:
      - EnchantingLevel{l=>2} true
    onFail:
    - sendActionBar:
        text: <red>Out of Experience
  - cooldown:
      id: symbioticwatershrooms
      length: 35s
      display: <#f7e7ce>Symbiotic Water-shrooms
  - mythicSkills:
    - symbiotic_water_shrooms_heal
resourcepack:
  textures:
    layers:
    - mineinabyss:hunting_relics/symbiotic_water-shrooms
