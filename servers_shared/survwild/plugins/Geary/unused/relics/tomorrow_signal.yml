set.item:
  type: minecraft:clock
  itemName: <dark_gray>Tomorrow Signal
  itemModel: mineinabyss:hunting_relics/tommorow_signal
resourcepack:
  model: mineinabyss:hunting_relics/tommorow_signal
observe:
  itemLeftClick:
  - become: parent
  - itemCooldown:
      group: mineinabyss:lightning_strike
      duration: 2s
  - eval: 'entity.getTargetBlock { maxDistance: 15 }'
    register: targetBlock
  - smite: {}
    with:
      location: '{{ targetBlock }}'
  - particle:
      particle: CLOUD
      count: 10
      speed: 0.2
    with:
      location: '{{ targetBlock }}'
