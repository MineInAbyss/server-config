####################################################################
##################### Right Click Ability ##########################
####################################################################

flamethrower_torrent:
  Skills:
    - gcd{ticks=80} @self
    - potion{type=SLOW;level=5;d=80} @self
    - gcd{ticks=40} @self
    - delay 8

    - skill{s=flamethrower_torrent_projectile_fire}
    - skill{s=flamethrower_torrent_projectile_shield_damage}
    - skill{s=flamethrower_torrent_projectile_damage}
    - delay 10

    - skill{s=flamethrower_torrent_projectile_fire}
    - skill{s=flamethrower_torrent_projectile_shield_damage}
    - skill{s=flamethrower_torrent_projectile_damage}
    - delay 10

    - skill{s=flamethrower_torrent_projectile_fire}
    - skill{s=flamethrower_torrent_projectile_shield_damage}
    - skill{s=flamethrower_torrent_projectile_damage}

flamethrower_torrent_projectile_fire: # Visible fire
  Conditions:
    - hasaurastacks{n=flamethrowercharge} true
  Skills:
    - projectile{
      i=1;repeat=20;repeati=2;syo=0.7;tyo=1;v=18;ho=-10;hnp=true;hp=true;hitself=false;se=false;
      bullet=BLOCK;material=FIRE;sfo=1.5;
      onHit=flamethrower-hit-visible;
      onStart=flamethrower-start} @forward{f=1000}

flamethrower_torrent_projectile_shield_damage: # Shield damage
  Conditions:
    - hasaurastacks{n=flamethrowercharge} true
  Skills:
    - projectile{
      i=1;repeat=1;repeati=40;syo=0.7;tyo=1;v=18;ho=-10;hnp=true;hitself=false;se=false;
      bullet=TEXT;sfo=1.5;
      onHit=flamethrower-hit-shield} @forward{f=1000}

flamethrower_torrent_projectile_damage: # Other damage
  Conditions:
    - hasaurastacks{n=flamethrowercharge} true
  Skills:
    - projectile{
      i=1;repeat=2;repeati=20;syo=0.7;tyo=1;v=18;ho=-10;hnp=true;hitself=false;se=false;
      bullet=TEXT;sfo=1.5;
      onHit=flamethrower-hit-damage} @forward{f=1000}

flamethrower-start:
  Conditions:
  - chance{chance=0.3} true
  Skills:
  - sound{s=entity.blaze.burn;p=1}

flamethrower-hit-visible:
  Skills:
  - ignite{ticks=150}
  - aura{auraName=flamethrowerroast;duration=100;i=1;c=1;maxStacks=1;cotd=false;rd=true;cod=false} @target
  
flamethrower-hit-shield:
  Skills:
  - damage{amount=3;pkb=true;ii=true;pi=true}

flamethrower-hit-damage:
  Skills:
  - damage{amount=0.5;pkb=true;ii=true;pi=true}
  - damage{amount=0.5;pkb=true;ii=true;pi=true;ignorearmor=true}

####################################################################
######################### Passive Ability ##########################
####################################################################

flamethrower_charge: # Shim for geary
  Skills:
  - skill{s=flamethrower_charge_}
flamethrower_charge_:
  Cooldown:
  Conditions:
  Skills:
  - aura{auraName=flamethrowercharge;duration=3;c=1;maxStacks=1;cotd=false;rd=true} @self
