  - sound{s=entity.breeze.charge;sc=ui;volume=0.7;pitch=0.8;repeat=1;repeati=10} @self 
  - summon{m=sin_spiral_center} @SelfLocation
  - summon{m=sin_spiral} @SelfLocation{x=4;z=0}
  - summon{m=sin_spiral} @SelfLocation{x=1.24;z=-3.8}
  - summon{m=sin_spiral} @SelfLocation{x=-3.24;z=-2.35}
  - summon{m=sin_spiral} @SelfLocation{x=-3.24;z=2.35}
  - summon{m=sin_spiral} @SelfLocation{x=1.24;z=3.8}

