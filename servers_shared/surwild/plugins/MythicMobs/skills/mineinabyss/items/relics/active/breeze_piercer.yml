  - delay 2
  - sound{s=entity.arrow.shoot;sc=ui;p=1;v=0.6} @self
  - projectile{bulletType=ARROW;arrowType=SPECTRAL;onHit=Quick_Shot_HIT;v=35;i=1;hR=1;vR=1;mr=40;hnp=true;hO=0;sE=true;sB=true;hs=false;hfs=0;syo=1.5;tyo=1.5;g=0.3} @forward{f=1000}
  - delay 2
  - sound{s=entity.arrow.shoot;sc=ui;p=1;v=0.6} @self
  - projectile{bulletType=ARROW;arrowType=SPECTRAL;onHit=Quick_Shot_HIT;v=35;i=1;hR=1;vR=1;mr=40;hnp=true;hO=0;sE=true;sB=true;hs=false;hfs=0;syo=1.5;tyo=1.5;g=0.3} @forward{f=1000}

