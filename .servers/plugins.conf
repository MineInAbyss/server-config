# Usage info: https://wiki.mineinabyss.com/contributing/setup/server-setup/#auto-download-plugins
#
# Prefer URLs in this order:
# - GitHub
# - Modrinth
# - Selfhosted on MineInAbyss
# - Avoid any other source
#
# Notes:
# - Don't use public links for premium plugins, use the rclone format instead
paper {
  # Plugins we often depend upon
  core {
    fawe: "https://repo.mineinabyss.com/plugins/fastasyncworldedit/FastAsyncWorldEdit-Paper-2.13.2-SNAPSHOT-1160.jar" // https://github.com/IntellectualSites/FastAsyncWorldEdit/releases
    worldguard: "https://repo.mineinabyss.com/plugins/worldguard/worldguard-bukkit-7.0.14-dist.jar" // https://dev.bukkit.org/projects/worldguard/files
    worldguard-extra-flags: "https://repo.mineinabyss.com/plugins/worldguardextraflags/WorldGuardExtraFlags-4.2.4.jar"

    idofront-platform: "github:MineInAbyss/Idofront:v1.0.5:.*jar" // https://github.com/MineInAbyss/Idofront/releases

    luckperms: "https://repo.mineinabyss.com/plugins/luckperms-bukkit/LuckPerms-Bukkit-5.5.10.jar" // https://luckperms.net/
    placeholderapi: "https://repo.mineinabyss.com/plugins/placeholderapi/PlaceholderAPI-2.11.6.jar" // https://www.spigotmc.org/resources/placeholderapi.6245/updates
    vault: "https://repo.mineinabyss.com/plugins/vault/Vault-1.7.3.jar"

    #protocollib: "https://repo.mineinabyss.com/plugins/protocollib/ProtocolLib-5.4.0-747.jar"
    deeperworld: "github:MineInAbyss/DeeperWorld:v0.12.1:.*jar" // https://github.com/MineInAbyss/DeeperWorld/releases

    guiy: "github:MineInAbyss/guiy-compose:v0.14.0:.*releases/.*guiy-compose.*jar" // https://github.com/MineInAbyss/guiy-compose/releases
    geary {
      geary: "github:MineInAbyss/geary-papermc:v0.33.9:.*jar" // https://github.com/MineInAbyss/geary-papermc/releases/
      blocky: "github:MineInAbyss/Blocky:v0.11.3:.*jar"
    }
    packy: "github:MineInAbyss/Packy:v0.8.8:.*jar"
    mineinabyss: "github:MineInAbyss/MineInAbyss:v0.17.4-dev.0:.*jar"

    myworlds: "https://repo.mineinabyss.com/plugins/myworlds/MyWorlds-1.21.8-v1-SNAPSHOT-332.jar"
    simplevoicechat: "https://cdn.modrinth.com/data/9eGKb6K1/versions/tfqjss5m/voicechat-bukkit-2.5.36.jar"
    discordsrv: "github:DiscordSRV/DiscordSRV:v1.30.0:.*.jar"
    bkcommonlib: "https://repo.mineinabyss.com/plugins/bkcommonlib/BKCommonLib-1.21.8-v1-SNAPSHOT-1904.jar"
  }

  shared-features {
    staminaclimb: "github:MineInAbyss/StaminaClimb:v0.24.1:.*jar"
  }

  survival-features {
    bonfire: "github:MineInAbyss/Bonfire:v1.12.4:.*jar"
    blocklocker: "https://repo.mineinabyss.com/plugins/blocklocker/BlockLocker-1.13.0.jar"
    mythichud: "mineinabyss:/private/plugins/mythichud/MythicHUD-1.3.0-SNAPSHOT-all.jar"
    okiboline {
      traincarts: "https://repo.mineinabyss.com/plugins/traincarts/TrainCarts-1.21.8-v1-SNAPSHOT-1651.jar"
      tccoasters: "https://repo.mineinabyss.com/plugins/tccoasters/TCCoasters-1.21.5-v2-SNAPSHOT-361.jar"
    }
    hibiscuscommons: "mineinabyss:/private/plugins/hibiscuscommons/HibiscusCommons-0.7.2.jar"
    hmccosmetics: "mineinabyss:/private/plugins/hmccosmetics/HMCCosmeticsRemapped-2.8.1.jar"
    hmccolor: "mineinabyss:/private/plugins/hmccolor/HMCColor-2.5.jar"
    hiddenore: "https://repo.mineinabyss.com/plugins/hiddenore/HiddenOre-2.5-dev.jar"
    shopkeepers: "https://repo.mineinabyss.com/plugins/shopkeepers/Shopkeepers-2.23.10.jar"
    shulkerpacks: "https://repo.mineinabyss.com/plugins/shulkerpacks/ShulkerPacks-1.7.3.jar"
  }

  chat {
    chatty: "github:MineInAbyss/Chatty:v0.9.1:.*paper.*jar"
    emojy: "github:MineInAbyss/Emojy:v0.10.15:.*jar"
    signedvelocity: "github:4drian3d/SignedVelocity:1.3.0:SignedVelocity-Paper-1.3.0.jar"
  }

  mobs {
    modelengine: "mineinabyss:/private/plugins/modelengine/ModelEngine-R4.0.9-2174.jar"
    mythicmobs: "mineinabyss:/private/plugins/mythicmobs/MythicMobs-5.10.0-SNAPSHOT-5493.jar"
  }

  utility {
    changeslots: "https://repo.mineinabyss.com/plugins/changeslots/ChangeSlots-2.4.0.jar"
    extracommands: "github:MineInAbyss/ExtraCommands:v0.12.0:.*jar"
    extracontexts: "https://repo.mineinabyss.com/plugins/extracontexts/ExtraContexts.jar"
    dev-tools {
    }
    huskhomes: "https://repo.mineinabyss.com/plugins/huskhomes/HuskHomes-Paper-4.9.9-f028d96.jar"
    doorcloser: "https://repo.mineinabyss.com/plugins/doorcloser/DoorCloser-1.0.12.jar"
    openinv: "mineinabyss:/plugins/openinv/OpenInv-5.1.13.jar"
    axiom: "https://repo.mineinabyss.com/plugins/axiom/AxiomPaper-5.0.1-for-MC1.21.8.jar"
  }

  builder-tools {
    buildersutilities: "https://repo.mineinabyss.com/plugins/buildersutilities/Builders-Utilities-2.1.1-136.jar"
    #favs: "https://repo.mineinabyss.com/plugins/favs/fastasyncvoxelsniper-3.1.1-SNAPSHOT.jar"
    goBrush: "https://repo.mineinabyss.com/plugins/gobrush/goBrush-3.8.0-87.jar"
    goPaint: "https://cdn.modrinth.com/data/qf7sNg9A/versions/iCJRYAlJ/BetterGoPaint-1.1.0.jar"
    arceon: "mineinabyss:/private/plugins/arceon/Arceon-0.5.3.jar"
  }

  performance {
    #viewdistancetweaks: "https://repo.mineinabyss.com/plugins/viewdistancetweaks/ViewDistanceTweaks-1.5.8-SNAPSHOT.jar"
  }

  velocity-bridge {
    #disablejoinmessage: "https://repo.mineinabyss.com/plugins/disablejoinmessage/DisableJoinMessage-1.0.jar"
    papi-proxy-bridge: "github:WiIIiam278/PAPIProxyBridge:1.8.4:PAPIProxyBridge-Bukkit-.*.jar"
  }
}

velocity {
  banannouncer: "https://repo.mineinabyss.com/plugins/banannouncer/BanAnnouncer_3.0.0.jar"
  chatty-velocity: "github:MineInAbyss/Chatty:v0.9.1:.*velocity.*jar"
  signedvelocity: "github:4drian3d/SignedVelocity:1.3.0:SignedVelocity-Proxy-1.3.0.jar"
  libertybans: "https://cdn.modrinth.com/data/PgXAUxLZ/versions/GjvARSgK/LibertyBans_Release-1.1.1.jar"
  luckperms-velocity: "https://repo.mineinabyss.com/plugins/luckperms-velocity/LuckPerms-Velocity-5.5.10.jar"
  maintenance-velocity: "github:kennytv/Maintenance:4.3.0:.*Maintenance-Velocity-.*.jar"
  minimotd-velocity: "https://cdn.modrinth.com/data/16vhQOQN/versions/b5BDM23m/minimotd-velocity-2.1.7.jar"
  papi-proxy-bridge: "github:WiIIiam278/PAPIProxyBridge:1.8.4:PAPIProxyBridge-Velocity-.*.jar"
  rocketjoin-velocity: "github:Lorenzo0111/RocketJoin:2.5:RocketJoin-velocity-.*.jar"
//  spark-velocity: "https://repo.mineinabyss.com/plugins/spark/spark-1.10.127-velocity.jar"
  spicord: "https://repo.mineinabyss.com/plugins/spicord/Spicord_5.7.2.jar"
  velocitab: "https://cdn.modrinth.com/data/Q10irTG0/versions/4I8ftzP3/Velocitab-1.7.8-973af9c.jar"
  unifiedMetrics: "github:Cubxity/UnifiedMetrics:v0.3.8:.*unifiedmetrics-platform-velocity-.*jar"
  simplevoicechat: "https://cdn.modrinth.com/data/9eGKb6K1/versions/tFPLv7Jr/voicechat-velocity-2.5.33.jar" # https://modrinth.com/plugin/simple-voice-chat/versions
  vivecraft: "https://github.com/JLyne/VivecraftVelocityExtensions/releases/download/v1.1/VivecraftVelocityExtensions-1.1.jar"
}

mineinabyss {
  # Plugins all production servers should have
  production-basic: ${paper.core} ${paper.utility} ${paper.chat} ${paper.velocity-bridge} ${paper.performance} {
    unifiedMetrics: "github:Cubxity/UnifiedMetrics:v0.3.8:.*unifiedmetrics-platform-bukkit-.*jar$"
    #pyroscope: "github:MineInAbyss/pyroscope-mc:v1.0.2:.*jar"
  }

  production: ${mineinabyss.production-basic} {
    coreprotect: "https://repo.mineinabyss.com/plugins/coreprotect/CoreProtect-CE-23.0.jar"
  }
  servers {
    velocity: ${velocity} {
    }

    build: ${mineinabyss.production} ${paper.builder-tools} ${paper.shared-features} {
    }

    survival: ${mineinabyss.production} ${paper.survival-features} ${paper.mobs} ${paper.shared-features} {
    }

    dev: ${mineinabyss.servers.survival} {
      mythicdungeons: "https://repo.mineinabyss.com/private/plugins/mythicdungeons/MythicDungeons-2.0.1-SNAPSHOT.jar"
      traincarts: "https://repo.mineinabyss.com/plugins/traincarts/TrainCarts-1.21.5-v2-SNAPSHOT-1638.jar"
      tccoasters: "https://repo.mineinabyss.com/plugins/tccoasters/TCCoasters-1.21.5-v2-SNAPSHOT-361.jar"
    }

    staging: ${mineinabyss.servers.survival} {
    }

    dev-alpha: ${paper.utility.dev-tools} ${paper.mobs} ${paper.core} {
      extracommands: ${paper.utility.extracommands}
    }

    # Used for local development, where as few plugins as possible are auto downloaded
    dev-basic: ${paper.utility.dev-tools} ${paper.mobs} ${paper.core} {
      extracommands: ${paper.utility.extracommands}
      chatty: ${paper.chat.chatty}
    }

    archive: ${mineinabyss.production-basic}  {
    }

    empty: {

    }
  }
}
