# Packs from GitHub server-config -> packs_assets/
common:
  default: true
  required: true
  filePath: Packy/resourcepacks/common
feat_blocks:
  default: true
  required: true
  filePath: Packy/resourcepacks/feat_blocks
feat_items:
  default: true
  required: true
  filePath: Packy/resourcepacks/feat_items
feat_items_private:
  default: true
  required: true
  filePath: Packy/resourcepacks/feat_items_private
feat_uis:
  default: true
  required: true
  filePath: Packy/resourcepacks/feat_uis
option_tools_2d:
  default: true
  required: false
  conflictsWith:
    - option_tools_3d
  filePath: Packy/resourcepacks/option_tools_2d
option_armor_new:
  default: true
  required: false
  conflictsWith:
    - option_armor_old
    - option_vanilla_armor
  filePath: Packy/resourcepacks/option_armor_new
option_tools_3d:
  default: false
  required: false
  conflictsWith:
    - option_tools_2d
  filePath: Packy/resourcepacks/option_tools_3d
option_armor_old:
  default: false
  required: false
  conflictsWith:
    - option_armor_new
    - option_vanilla_armor
  filePath: Packy/resourcepacks/option_armor_old
custom_music:
  default: false
  required: false
  filePath: Packy/resourcepacks/ost
option_vanilla_armor:
  default: false
  required: false
  conflictsWith:
    - option_armor_new
    - option_armor_old
option_vanilla_tools:
  default: false
  required: false
  conflictsWith:
    - option_tools_2d
    - option_tools_3d
events:
  default: true
  required: true
  filePath: Packy/resourcepacks/events
events_private:
  default: true
  required: true
  filePath: Packy/resourcepacks/events_private
# Packs generated by other plugins
geary:
  default: true
  required: true
  filePath: Geary/resourcepack.zip
modelengine:
  default: true
  required: true
  loadTrigger:
    type: ModelEngine
emotes:
  default: true
  required: true
  filePath: Emojy/pack.zip
custom_hud:
  default: true
  required: false
  filePath: MythicHUD/built-pack
openinv_addon:
  default: true
  required: true
  githubDownload:
    org: Jikoo
    repo: OpenInv
    branch: master
    subFolder: resource-pack/openinv-legibility-pack
custom_blocks:
  default: true
  required: true
  filePath: Blocky/pack
