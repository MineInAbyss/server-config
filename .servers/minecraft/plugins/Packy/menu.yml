title: Packy Pack Picker
height: 6
subMenus:
  hud:
    title: Custom Hud
    height: 6
    button:
      type: minecraft:compass
      itemName: <gold>Custom Hud
    modifiers:
      offset:
        x: 4
        y: 4
      size:
        width: 1
        height: 1
    type: MENU
    packs:
      custom_hud: {}
  music:
    title: Music
    height: 6
    button:
      type: minecraft:paper
      itemName: <gold>Music
      itemModel: mineinabyss:gui/packy/music_toggle
    modifiers:
      offset:
        x: 4
        y: 1
      size:
        width: 1
        height: 1
    type: MENU
    packs:
      custom_music: {}
  armor:
    title: Armor Picker
    height: 6
    button:
      type: minecraft:paper
      itemModel: mineinabyss:gui/packy/armor
    modifiers:
      offset:
        x: 1
        y: 1
      size:
        width: 2
        height: 4
    type: CYCLING
    allSlotsEmptyExceptFirst: true
    packs:
      option_armor_new:
        button:
          type: minecraft:paper
          itemName: <gold>New Armor
      option_armor_old:
        button:
          type: minecraft:paper
          itemName: <gold>Old Armor
      option_vanilla_armor:
        button:
          type: minecraft:paper
          itemName: <gold>Vanilla
  tools:
    title: Packy Pack Picker2
    height: 6
    button:
      type: minecraft:paper
      itemModel: mineinabyss:gui/packy/tools
    modifiers:
      offset:
        x: 6
        y: 1
      size:
        width: 2
        height: 4
    type: CYCLING
    packs:
      option_tools_2d:
        button:
          type: minecraft:paper
          itemName: <gold>2D Tools
      option_tools_3d:
        button:
          type: minecraft:paper
          itemName: <gold>3D Tools
      option_vanilla_tools:
        button:
          type: minecraft:paper
          itemName: <gold>Vanilla Tools